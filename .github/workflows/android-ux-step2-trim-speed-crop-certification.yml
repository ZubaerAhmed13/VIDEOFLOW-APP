name: VideoFlow UX Step 2 Trim Speed Crop Certification

on:
  push:
    branches:
      - ux-step2-trim-speed-crop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-step2-trim-speed-crop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-source-audit:
    name: Source scope, fixtures, unit, lint, androidTest and APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          mkdir -p "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          sdkmanager 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0
          chmod +x gradlew

      - name: Generate deterministic Step 2 media fixtures
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p app/src/androidTest/assets app/src/debug/assets
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=30 \
            -f lavfi -i sine=frequency=880:sample_rate=48000 \
            -t 3 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            app/src/androidTest/assets/sample_av.mp4
          cp app/src/androidTest/assets/sample_av.mp4 app/src/debug/assets/sample_av.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=30 \
            -t 2 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart \
            app/src/debug/assets/sample_video_only.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=30 \
            -t 2 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -metadata:s:v:0 rotate=90 -movflags +faststart \
            app/src/debug/assets/sample_rotated.mp4
          printf 'VideoFlow intentionally malformed media fixture\n' > app/src/debug/assets/malformed.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=black:size=320x240:rate=30,drawbox=color=white:t=fill:enable='between(t,0.6,0.68)+between(t,1.5,1.58)'" \
            -f lavfi -i "aevalsrc=0.7*sin(2*PI*1000*t)*(between(t\,0.6\,0.68)+between(t\,1.5\,1.58)):s=48000" \
            -t 2 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            app/src/androidTest/assets/step5-sync.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=black:size=320x240:rate=30,drawbox=x=140:y=100:w=40:h=40:color=white:t=fill" \
            -f lavfi -i sine=frequency=880:sample_rate=48000 \
            -t 2 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            app/src/androidTest/assets/step2-geometry.mp4
          test -s app/src/androidTest/assets/sample_av.mp4
          test -s app/src/androidTest/assets/step5-sync.mp4
          test -s app/src/androidTest/assets/step2-geometry.mp4
          test -s app/src/debug/assets/sample_av.mp4
          test -s app/src/debug/assets/sample_video_only.mp4
          test -s app/src/debug/assets/sample_rotated.mp4
          test -s app/src/debug/assets/malformed.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 app/src/androidTest/assets/step2-geometry.mp4 | tee ux-step2-fixture-info.txt
          grep -q 'codec_name=h264' ux-step2-fixture-info.txt
          grep -q 'width=320' ux-step2-fixture-info.txt
          grep -q 'height=240' ux-step2-fixture-info.txt

      - name: Step 2 source-scope and hard invariant audit
        shell: bash
        run: |
          set -euo pipefail
          BASE='0123b734f687dfdbf0589b6040aeb4d8642c5968'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee ux-step2-changed-files.txt
          ! grep -E '^app/src/main/java/com/videoflow/app/(ai|data/proxy|domain/ai)/' ux-step2-changed-files.txt

          # Focused Trim: source range changes while timeline anchor stays stable.
          grep -q 'trimSourceRangeKeepingTimelineAnchor' app/src/main/java/com/videoflow/app/domain/editor/TimelineEngine.kt
          grep -q 'trimClipContentsKeepingTimelineAnchor' app/src/main/java/com/videoflow/app/data/editor/EditorRepository.kt
          grep -q 'fadeInUs = clip.fadeInUs.coerceAtMost(newDurationUs)' app/src/main/java/com/videoflow/app/domain/editor/TimelineEngine.kt
          grep -q 'formatHumanDurationUs' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
          grep -q 'sampleTrimFilmstrip(clip.assetId, clip.sourceStartUs, clip.sourceEndUs, 10)' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt

          # Speed: draft/live preview plus readable authoritative duration math.
          grep -q 'speedAdjustedDurationUs' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
          grep -q 'String.format(java.util.Locale.US, "%.2f", value)' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
          grep -q 'effectivePreviewSpeed' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt

          # Crop: one normalized source-space contract is shared by preview and final render.
          grep -q 'aspectCropAroundCurrentCenter' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
          grep -q 'normalizedCropToMedia3Bounds' app/src/main/java/com/videoflow/app/render/effects/Media3CropEffect.kt
          grep -q 'Crop(bounds.left, bounds.right, bounds.bottom, bounds.top)' app/src/main/java/com/videoflow/app/render/effects/Media3CropEffect.kt
          grep -q 'media3CropEffectOrNull' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          grep -q 'media3CropEffectOrNull(clip.transform.crop)' app/src/main/java/com/videoflow/app/render/Media3CompositionBuilder.kt
          ! grep -q 'uniformCropPreviewGeometry' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          ! grep -q 'cropCenterX' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          ! grep -q 't.scaleX / cropWidth' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          ! grep -q 't.scaleY / cropHeight' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          grep -q 'return factor to factor' app/src/main/java/com/videoflow/app/render/Media3CompositionBuilder.kt
          grep -q 'onDone = { onCommitCrop(crop) }' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt

          test -s app/src/test/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropCoreTest.kt
          test -s app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt
          test -s app/src/androidTest/java/com/videoflow/app/step5/UXStep2CropRenderGeometryTest.kt
          test -s scripts/ux_step2/run_api35_certification.sh
          grep -q "run_suite step1-shell-regression" scripts/ux_step2/run_api35_certification.sh
          grep -q "run_suite step2-trim-speed-crop-ui" scripts/ux_step2/run_api35_certification.sh
          grep -q "run_suite step2-crop-real-render" scripts/ux_step2/run_api35_certification.sh
          test -s UX_STEP_2_TRIM_SPEED_CROP_COMPLETION_REPORT.md

      - name: Full unit regression
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Compile instrumentation and Compose tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble exact debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify retained debug fixtures are packaged
        shell: bash
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee ux-step2-debug-apk-assets.txt
          for fixture in sample_av.mp4 sample_video_only.mp4 sample_rotated.mp4 malformed.mp4; do
            grep -q "assets/$fixture" ux-step2-debug-apk-assets.txt
          done

      - name: Package exact-head runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ux-step2-runtime
          cp app/build/outputs/apk/debug/app-debug.apk ux-step2-runtime/VideoFlow_UXStep2_Debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ux-step2-runtime/VideoFlow_UXStep2_Debug-androidTest.apk
          git rev-parse HEAD > ux-step2-runtime/EXACT_HEAD.txt
          cp ux-step2-fixture-info.txt ux-step2-changed-files.txt ux-step2-debug-apk-assets.txt ux-step2-runtime/
          (cd ux-step2-runtime && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload exact API 35 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-UX-Step2-Runtime-Bundle
          path: ux-step2-runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build, unit and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-UX-Step2-Build-Evidence
          path: |
            app/build/reports/
            app/build/test-results/
            ux-step2-fixture-info.txt
            ux-step2-changed-files.txt
            ux-step2-debug-apk-assets.txt
          if-no-files-found: warn
          retention-days: 30

  api35-product-regression:
    name: API 35 Step 1 regression, Step 2 product and render certification
    needs: build-test-source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/system-images" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/sources" "$ANDROID_HOME/extras" || true
          sudo apt-get clean || true
          df -h /

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Download exact runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: VideoFlow-UX-Step2-Runtime-Bundle
          path: ux-step2-runtime

      - name: Verify exact-head runtime integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ux-step2-runtime/EXACT_HEAD.txt)" = "$GITHUB_SHA"
          (cd ux-step2-runtime && sha256sum -c SHA256SUMS.txt)

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$USER":"$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm

      - name: Run API 35 production UX, render and retained-product certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disk-size: 3072M
          script: bash scripts/ux_step2/run_api35_certification.sh

      - name: Upload API 35 Step 2 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-UX-Step2-API35-Evidence
          path: |
            ux-step2-emulator-reports/
            ux-step2-evidence/
          if-no-files-found: warn
          retention-days: 30

  exact-head-completion-report:
    name: Exact-head completion report
    needs:
      - build-test-source-audit
      - api35-product-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certified head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact runtime binding
        uses: actions/download-artifact@v4
        with:
          name: VideoFlow-UX-Step2-Runtime-Bundle
          path: ux-step2-runtime

      - name: Bind report to successful exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ux-step2-runtime/EXACT_HEAD.txt)" = "$GITHUB_SHA"
          python scripts/ux_step2/finalize_step2_certification_metadata.py
          BASE='0123b734f687dfdbf0589b6040aeb4d8642c5968'
          git diff --name-only "$BASE"..."$GITHUB_SHA" > ux-step2-final-report/CHANGED_FILES.txt
          printf 'UX STEP 2 — TRIM / SPEED / CROP\nSOFTWARE IMPLEMENTATION: COMPLETE\nAUTOMATED CERTIFICATION: PASS\nSTEP 1 REGRESSION: PASS\nPHYSICAL DEVICE CERTIFICATION: NOT RUN\nEFFECTS / ENHANCE UX: DEFERRED TO STEP 3\nAI WATERMARK UX: DEFERRED TO STEP 4\nFINAL WHOLE-APP UX CERTIFICATION: NOT RUN\n' > ux-step2-final-report/STATUS.txt

      - name: Upload authoritative exact-head completion report
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-UX-Step2-Completion-Report
          path: ux-step2-final-report/
          if-no-files-found: error
          retention-days: 30
