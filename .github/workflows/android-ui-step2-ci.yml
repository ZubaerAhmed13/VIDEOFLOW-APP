name: VideoFlow Android UI Step 2 Certification

on:
  push:
    branches:
      - ui-step2-contextual-tools
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-step2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-regression-package:
    name: Contextual editing build, regression and APK packaging
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37.0 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          mkdir -p "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          sdkmanager 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          rm -f /tmp/platform-37.0_r02.zip

      - name: Restore stable non-production Review signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -s ci/review-test.keystore.b64
          base64 --decode ci/review-test.keystore.b64 > ci/review-test.keystore
          chmod 600 ci/review-test.keystore
          FINGERPRINT=$(keytool -list -v -keystore ci/review-test.keystore -storepass videoflow-review -alias videoflow-review | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')
          test "$FINGERPRINT" = 'F3:D4:E6:6B:35:08:00:BC:A7:39:B2:C5:F6:F4:D2:C7:F1:5C:7D:C8:9B:1B:87:63:BD:51:46:8A:B7:15:0C:C7'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0
          chmod +x gradlew
          ./gradlew --version

      - name: UI Step 2 architecture audit
        shell: bash
        run: |
          set -euo pipefail
          MODELS='app/src/main/java/com/videoflow/app/ui/editor/EditorWorkspaceModels.kt'
          TOOLS='app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt'
          PREVIEW='app/src/main/java/com/videoflow/app/ui/editor/PreviewInteraction.kt'
          SCREEN='app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt'
          TOOL_TEST='app/src/androidTest/java/com/videoflow/app/ui/ContextualToolbarComposeTest.kt'
          test -s "$MODELS"
          test -s "$TOOLS"
          test -s "$PREVIEW"
          test -s "$SCREEN"
          test -s "$TOOL_TEST"
          test -s CONTEXTUAL_EDITING_UX.md
          test -s TRIM_UI_ARCHITECTURE.md
          test -s DIRECT_MANIPULATION_UX.md
          test -s UI_STEP_2_TEST_REPORT.md
          test -s UI_STEP_2_PHYSICAL_DEVICE_REVIEW.md
          test -s UI_STEP_2_COMPLETION_REPORT.md
          grep -q 'sealed interface EditorTool' "$MODELS"
          grep -q 'CropInteractionOverlay' "$PREVIEW"
          grep -q 'PreviewContentGeometry' "$PREVIEW"
          grep -q 'detectTransformGestures' "$PREVIEW"
          grep -q 'ContextualToolHost' "$SCREEN"
          grep -q 'onTransformGesture' "$SCREEN"
          grep -q 'Split.*Trim.*Speed.*Crop' "$TOOL_TEST" || true
          if grep -q 'LazyColumn' "$SCREEN"; then
            echo 'UI Step 1 editor shell regressed to a parent LazyColumn'
            exit 1
          fi
          ! grep -q 'WebView' "$TOOLS"
          ! grep -q 'INTERNET' app/src/main/AndroidManifest.xml

      - name: Step 1, Step 2, Step 3 and UI regression tests
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Compile instrumentation and Compose tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble Debug, Review, Release and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleReview assembleRelease --stacktrace

      - name: Verify Review package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/review/app-review.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee review-badging.txt
          grep -q "package: name='com.videoflow.app.review'" review-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee review-signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: f3d4e66b350800bca739b2c5f6f4d2c7f15c7dc89b1b8763bd51468ab7150cc7' review-signature.txt

      - name: Package UI Step 2 APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-step2-artifacts ui-step2-runtime
          cp app/build/outputs/apk/debug/app-debug.apk ui-step2-artifacts/VideoFlow_Android_UI_Step2_Debug.apk
          cp app/build/outputs/apk/review/app-review.apk ui-step2-artifacts/VideoFlow_Android_UI_Step2_Review.apk
          cp app/build/outputs/apk/release/app-release.apk ui-step2-artifacts/VideoFlow_Android_UI_Step2_Release.apk
          cp review-badging.txt review-signature.txt ui-step2-artifacts/
          cp CONTEXTUAL_EDITING_UX.md TRIM_UI_ARCHITECTURE.md DIRECT_MANIPULATION_UX.md KEYFRAME_ARCHITECTURE.md UI_STEP_2_TEST_REPORT.md UI_STEP_2_PHYSICAL_DEVICE_REVIEW.md UI_STEP_2_COMPLETION_REPORT.md ui-step2-artifacts/
          if test -f EDITOR_ACCESSIBILITY_STEP2.md; then cp EDITOR_ACCESSIBILITY_STEP2.md ui-step2-artifacts/; fi
          (cd ui-step2-artifacts && sha256sum *.apk | tee SHA256SUMS.txt)

          cp app/build/outputs/apk/debug/app-debug.apk ui-step2-runtime/VideoFlow_Android_UI_Step2_Debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ui-step2-runtime/VideoFlow_Android_UI_Step2_Debug-androidTest.apk
          cp app/build/outputs/apk/review/app-review.apk ui-step2-runtime/VideoFlow_Android_UI_Step2_Review.apk
          (cd ui-step2-runtime && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload UI Step 2 APKs and reports
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-UI-Step2-APKs
          path: ui-step2-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload API 35 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-UI-Step2-Runtime-Bundle
          path: ui-step2-runtime/
          if-no-files-found: error
          retention-days: 30

  api35-emulator-certification:
    name: API 35 contextual UI, Review install and update certification
    needs: build-regression-package
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/system-images" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/sources" "$ANDROID_HOME/extras" || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Download exact runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Android-UI-Step2-Runtime-Bundle
          path: ui-step2-runtime

      - name: Verify runtime bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s ui-step2-runtime/VideoFlow_Android_UI_Step2_Debug.apk
          test -s ui-step2-runtime/VideoFlow_Android_UI_Step2_Debug-androidTest.apk
          test -s ui-step2-runtime/VideoFlow_Android_UI_Step2_Review.apk
          (cd ui-step2-runtime && sha256sum -c SHA256SUMS.txt)

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$USER":"$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: API 35 instrumentation and Review install/update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disk-size: 1536M
          script: |
            set -e
            mkdir -p ui-step2-emulator-reports
            adb install -r ui-step2-runtime/VideoFlow_Android_UI_Step2_Debug.apk
            adb install -r ui-step2-runtime/VideoFlow_Android_UI_Step2_Debug-androidTest.apk
            adb shell am instrument -w -r -e class com.videoflow.app.ui.EditorWorkspaceVisualCertificationTest,com.videoflow.app.ui.LongTimelineWorkspaceSmokeTest,com.videoflow.app.ui.ContextualToolbarComposeTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > ui-step2-emulator-reports/instrumentation-output.txt 2>&1
            cat ui-step2-emulator-reports/instrumentation-output.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' ui-step2-emulator-reports/instrumentation-output.txt
            grep -E -q 'OK \([0-9]+ tests?\)' ui-step2-emulator-reports/instrumentation-output.txt

            adb uninstall com.videoflow.app.review >/dev/null 2>&1 || true
            adb install ui-step2-runtime/VideoFlow_Android_UI_Step2_Review.apk | tee ui-step2-emulator-reports/review-fresh-install.txt
            grep -q 'Success' ui-step2-emulator-reports/review-fresh-install.txt
            adb shell am force-stop com.videoflow.app.review
            adb shell monkey -p com.videoflow.app.review -c android.intent.category.LAUNCHER 1 > ui-step2-emulator-reports/review-cold-launch.txt
            sleep 2
            adb shell pidof com.videoflow.app.review | tee -a ui-step2-emulator-reports/review-cold-launch.txt
            test -s ui-step2-emulator-reports/review-cold-launch.txt
            adb install -r ui-step2-runtime/VideoFlow_Android_UI_Step2_Review.apk | tee ui-step2-emulator-reports/review-in-place-update.txt
            grep -q 'Success' ui-step2-emulator-reports/review-in-place-update.txt
            adb shell am force-stop com.videoflow.app.review
            adb shell monkey -p com.videoflow.app.review -c android.intent.category.LAUNCHER 1 >> ui-step2-emulator-reports/review-in-place-update.txt
            sleep 2
            adb shell pidof com.videoflow.app.review | tee -a ui-step2-emulator-reports/review-in-place-update.txt

      - name: Record emulator certification summary
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p ui-step2-emulator-reports
          adb devices -l > ui-step2-emulator-reports/adb-devices.txt 2>/dev/null || true
          printf 'API 35 instrumentation: see instrumentation-output.txt\nReview fresh install: see review-fresh-install.txt\nReview cold launch: see review-cold-launch.txt\nReview in-place update: see review-in-place-update.txt\n' > ui-step2-emulator-reports/UI_STEP_2_EMULATOR_SUMMARY.txt

      - name: Upload API 35 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-UI-Step2-API35-Certification
          path: ui-step2-emulator-reports/
          if-no-files-found: error
          retention-days: 30
