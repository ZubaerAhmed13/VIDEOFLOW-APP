name: UI Step 2 editor draft integration patch v2

on:
  push:
    branches: [ui-step2-contextual-tools]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add robust one-shot editor draft integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-step2-contextual-tools
          fetch-depth: 0
      - name: Integrate transient draft with editor screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt')
          s = p.read_text()

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing marker: {label}')
              s = s.replace(old, new, 1)

          once('import com.videoflow.app.domain.editor.ImageOverlay\n', 'import com.videoflow.app.domain.editor.ImageOverlay\nimport com.videoflow.app.domain.editor.KeyframeEvaluator\nimport com.videoflow.app.domain.editor.KeyframeProperty\n', 'domain imports')
          once('import com.videoflow.app.ui.editor.ContextualToolHost\n', 'import com.videoflow.app.ui.editor.ContextualPreviewDraft\nimport com.videoflow.app.ui.editor.ContextualToolHost\n', 'draft import')
          once('import com.videoflow.app.ui.editor.PreviewWorkspace\n', 'import com.videoflow.app.ui.editor.PreviewTextStyleDraft\nimport com.videoflow.app.ui.editor.PreviewTransformDraft\nimport com.videoflow.app.ui.editor.PreviewWorkspace\n', 'preview imports')
          once('import kotlinx.coroutines.delay\n', 'import kotlinx.coroutines.delay\nimport kotlin.math.abs\n', 'abs import')
          once('    var activeTool by remember { mutableStateOf<EditorTool?>(null) }\n', '    var activeTool by remember { mutableStateOf<EditorTool?>(null) }\n    var previewDraft by remember { mutableStateOf(ContextualPreviewDraft()) }\n', 'draft state')
          once('        activeTool = null\n        initialToolClip = null', '        activeTool = null\n        previewDraft = ContextualPreviewDraft()\n        initialToolClip = null', 'clear draft')
          once('        activeTool = tool\n        initialToolClip = null', '        activeTool = tool\n        previewDraft = ContextualPreviewDraft()\n        initialToolClip = null', 'open draft reset')

          init_marker = '''        when (tool) {
              is EditorTool.Trim, is EditorTool.Crop, is EditorTool.TextEditor, is EditorTool.TextStyle -> isPlaying = false'''
          init_block = '''        fun evaluated(ownerId: String, property: KeyframeProperty, base: Float, startUs: Long, durationUs: Long): Float {
              val localUs = (playheadUs - startUs).coerceIn(0L, durationUs.coerceAtLeast(1L))
              return KeyframeEvaluator.evaluate(
                  base,
                  localUs,
                  timeline?.keyframes.orEmpty().filter { it.ownerId == ownerId && it.property == property }
              )
          }
          previewDraft = when (tool) {
              is EditorTool.Crop -> clips.firstOrNull { it.id == tool.clipId }?.let { ContextualPreviewDraft(crop = it.transform.crop) } ?: ContextualPreviewDraft()
              is EditorTool.Volume -> clips.firstOrNull { it.id == tool.clipId }?.let { clip ->
                  ContextualPreviewDraft(gainDb = evaluated(clip.id, KeyframeProperty.AUDIO_GAIN, clip.gainDb, clip.timelineStartUs, clip.timelineDurationUs))
              } ?: ContextualPreviewDraft()
              is EditorTool.Fade -> clips.firstOrNull { it.id == tool.clipId }?.let { ContextualPreviewDraft(fadeInUs = it.fadeInUs, fadeOutUs = it.fadeOutUs) } ?: ContextualPreviewDraft()
              is EditorTool.Transform -> when (tool.ownerType) {
                  VisualOwnerType.CLIP -> clips.firstOrNull { it.id == tool.ownerId }?.let { clip ->
                      val d = clip.timelineDurationUs
                      ContextualPreviewDraft(transform = PreviewTransformDraft(
                          evaluated(clip.id, KeyframeProperty.POSITION_X, clip.transform.x, clip.timelineStartUs, d),
                          evaluated(clip.id, KeyframeProperty.POSITION_Y, clip.transform.y, clip.timelineStartUs, d),
                          evaluated(clip.id, KeyframeProperty.SCALE_X, clip.transform.scaleX, clip.timelineStartUs, d),
                          evaluated(clip.id, KeyframeProperty.SCALE_Y, clip.transform.scaleY, clip.timelineStartUs, d),
                          evaluated(clip.id, KeyframeProperty.ROTATION, clip.transform.rotationDegrees, clip.timelineStartUs, d),
                          clip.transform.flipHorizontal,
                          clip.transform.flipVertical
                      ))
                  } ?: ContextualPreviewDraft()
                  VisualOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay ->
                      val d = overlay.timelineEndUs - overlay.timelineStartUs
                      ContextualPreviewDraft(transform = PreviewTransformDraft(
                          evaluated(overlay.id, KeyframeProperty.POSITION_X, overlay.transform.x, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.POSITION_Y, overlay.transform.y, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.SCALE_X, overlay.transform.scaleX, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.SCALE_Y, overlay.transform.scaleY, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.ROTATION, overlay.transform.rotationDegrees, overlay.timelineStartUs, d)
                      ))
                  } ?: ContextualPreviewDraft()
                  VisualOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay ->
                      val d = overlay.timelineEndUs - overlay.timelineStartUs
                      ContextualPreviewDraft(transform = PreviewTransformDraft(
                          evaluated(overlay.id, KeyframeProperty.POSITION_X, overlay.transform.x, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.POSITION_Y, overlay.transform.y, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.SCALE_X, overlay.transform.scaleX, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.SCALE_Y, overlay.transform.scaleY, overlay.timelineStartUs, d),
                          evaluated(overlay.id, KeyframeProperty.ROTATION, overlay.transform.rotationDegrees, overlay.timelineStartUs, d)
                      ))
                  } ?: ContextualPreviewDraft()
              }
              is EditorTool.Opacity -> when (tool.ownerType) {
                  VisualOwnerType.CLIP -> clips.firstOrNull { it.id == tool.ownerId }?.let { clip -> ContextualPreviewDraft(opacity = evaluated(clip.id, KeyframeProperty.OPACITY, clip.opacity, clip.timelineStartUs, clip.timelineDurationUs)) } ?: ContextualPreviewDraft()
                  VisualOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay -> ContextualPreviewDraft(opacity = evaluated(overlay.id, KeyframeProperty.OPACITY, overlay.opacity, overlay.timelineStartUs, overlay.timelineEndUs - overlay.timelineStartUs)) } ?: ContextualPreviewDraft()
                  VisualOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay -> ContextualPreviewDraft(opacity = evaluated(overlay.id, KeyframeProperty.OPACITY, overlay.transform.opacity, overlay.timelineStartUs, overlay.timelineEndUs - overlay.timelineStartUs)) } ?: ContextualPreviewDraft()
              }
              is EditorTool.TextEditor -> ContextualPreviewDraft(textContent = tool.overlayId?.let { idValue -> timeline?.textOverlays?.firstOrNull { it.id == idValue }?.content }.orEmpty())
              is EditorTool.TextStyle -> timeline?.textOverlays?.firstOrNull { it.id == tool.overlayId }?.let { overlay ->
                  ContextualPreviewDraft(textStyle = PreviewTextStyleDraft(overlay.fontSizeSp, overlay.fontWeight, overlay.italic, overlay.alignment, overlay.colorArgb))
              } ?: ContextualPreviewDraft()
              else -> ContextualPreviewDraft()
          }

          when (tool) {
              is EditorTool.Trim, is EditorTool.Crop, is EditorTool.TextEditor, is EditorTool.TextStyle -> isPlaying = false'''
          once(init_marker, init_block, 'draft initialization block')

          # Cancel no longer performs compensating DB writes; uncommitted draft is simply discarded.
          s, n = re.subn(r'    fun cancelActiveTool\(\) \{.*?\n    }\n\n    fun closeOrBack', '''    fun cancelActiveTool() {
              clearToolSession()
          }

          fun closeOrBack''', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('cancel replacement failed')

          s, n = re.subn(r'    fun transformGesture\(dx: Float, dy: Float, zoom: Float, rotation: Float\) \{.*?\n    }\n\n    BackHandler', '''    fun transformGesture(dx: Float, dy: Float, zoom: Float, rotation: Float) {
              if (activeTool !is EditorTool.Transform) return
              val current = previewDraft.transform ?: return
              val rawX = (current.x + dx).coerceIn(0f, 1f)
              val rawY = (current.y + dy).coerceIn(0f, 1f)
              val snappedX = if (abs(rawX - 0.5f) < 0.018f) 0.5f else rawX
              val snappedY = if (abs(rawY - 0.5f) < 0.018f) 0.5f else rawY
              previewDraft = previewDraft.copy(transform = current.copy(
                  x = snappedX,
                  y = snappedY,
                  scaleX = (current.scaleX * zoom).coerceIn(0.05f, 10f),
                  scaleY = (current.scaleY * zoom).coerceIn(0.05f, 10f),
                  rotationDegrees = current.rotationDegrees + rotation
              ))
          }

          BackHandler''', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('transform gesture replacement failed')

          # Replace all three workspace preview calls regardless of indentation/weight.
          pattern = re.compile(r'''PreviewWorkspace\(\n(?P<i>\s*)project, editor, playheadUs, isPlaying, (?P<mod>Modifier\.weight\([^\n]+\)), activeTool,\n(?P=i)onCropChange = \{ crop ->\n(?P=i)    \(activeTool as\? EditorTool\.Crop\)\?\.let \{ tool -> contextualVm\.setClipCrop\(id, tool\.clipId, crop\) \{ vm\.load\(id\) } }\n(?P=i)},\n(?P=i)onTransformGesture = ::transformGesture\n(?P=close>\s*)\)''')
          def repl(m):
              i=m.group('i'); mod=m.group('mod'); close=m.group('close')
              return f'''PreviewWorkspace(\n{i}project, editor, playheadUs, isPlaying, {mod}, activeTool, previewDraft,\n{i}onCropChange = {{ crop -> previewDraft = previewDraft.copy(crop = crop) }},\n{i}onCropCommit = {{ }},\n{i}onTransformGesture = ::transformGesture,\n{i}onTransformGestureEnd = {{ }}\n{close})'''
          s, n = pattern.subn(repl, s)
          if n != 3: raise SystemExit(f'expected 3 PreviewWorkspace replacements, got {n}')

          once('        overlayVm = overlayVm,\n        onDismiss = ::clearToolSession,', '        overlayVm = overlayVm,\n        previewDraft = previewDraft,\n        onPreviewDraftChange = { previewDraft = it },\n        onDismiss = ::clearToolSession,', 'host draft args')

          p.write_text(s)
          PY

          git diff --check
          git config user.name 'Zubaer Ahmed'
          git config user.email 'zubaerknight@gmail.com'
          git add app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt
          git commit -m 'Integrate transient preview drafts into editor workspace'
          git push origin ui-step2-contextual-tools
