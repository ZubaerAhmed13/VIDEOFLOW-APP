name: VideoFlow Android Step 1 Certification

on:
  push:
    branches: [ main, step1-certification ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-certification:
    name: Build, unit, lint and APK certification
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37.0 platform
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          mkdir -p "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          sdkmanager 'build-tools;36.0.0'
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          rm -f /tmp/platform-37.0_r02.zip
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0
          chmod +x gradlew
          ./gradlew --version

      - name: Generate deterministic MP4 instrumentation fixtures
        run: ./scripts/generate-test-fixtures.sh

      - name: Step 1 prohibited-pattern audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'inputStream\.readBytes\(\)|ByteArray\([^)]*(fileSize|sizeBytes|file\.length)|WebView|android\.permission\.INTERNET' app/src/main app/src/main/AndroidManifest.xml; then
            echo 'Step 1 prohibited pattern detected.'
            exit 1
          fi
          if grep -R -n -E 'TODO|FIXME|Coming Soon|Not Implemented' app/src/main; then
            echo 'Unfinished Step 1 marker detected.'
            exit 1
          fi

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble debug APK and instrumentation APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Assemble test-signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare exact runtime certification APK bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_APK='app/build/outputs/apk/debug/app-debug.apk'
          TEST_APK='app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          test -f "$APP_APK"
          test -f "$TEST_APK"
          mkdir -p step1-runtime
          cp "$APP_APK" step1-runtime/VideoFlow_Android_Step1_Debug.apk
          cp "$TEST_APK" step1-runtime/VideoFlow_Android_Step1_Debug-androidTest.apk
          sha256sum step1-runtime/*.apk | tee step1-runtime/SHA256SUMS.txt

      - name: Upload exact runtime certification APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-Step1-Runtime-Bundle
          path: step1-runtime
          if-no-files-found: error
          retention-days: 30

      - name: Package build certification artifacts
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p step1-deliverables/reports
          [ ! -f app/build/outputs/apk/debug/app-debug.apk ] || cp app/build/outputs/apk/debug/app-debug.apk step1-deliverables/VideoFlow_Android_Step1_Debug.apk
          [ ! -f app/build/outputs/apk/release/app-release.apk ] || cp app/build/outputs/apk/release/app-release.apk step1-deliverables/VideoFlow_Android_Step1_Release.apk
          cp -R app/build/reports step1-deliverables/reports/app-build-reports 2>/dev/null || true
          git archive --format=zip --output=step1-deliverables/VideoFlow_Android_Step1_Source.zip HEAD || true
          cd step1-deliverables
          : > SHA256SUMS.txt
          [ ! -f VideoFlow_Android_Step1_Source.zip ] || sha256sum VideoFlow_Android_Step1_Source.zip >> SHA256SUMS.txt
          for apk in *.apk; do [ -f "$apk" ] && sha256sum "$apk" >> SHA256SUMS.txt || true; done
          cat SHA256SUMS.txt

      - name: Upload build certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-Step1-Build-Certification
          path: step1-deliverables
          if-no-files-found: error
          retention-days: 30

  emulator-certification:
    name: API 35 emulator instrumentation certification
    needs: build-certification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Reclaim unrelated hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Before cleanup ==='
          df -h /

          # These hosted-runner toolchains are unrelated to native Android Step 1.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          # Preserve SDK command-line tools, platform-tools and licenses. The emulator
          # action installs the exact API-35 runtime components it requires below.
          sudo rm -rf "$ANDROID_HOME/ndk" || true
          sudo rm -rf "$ANDROID_HOME/cmake" || true
          sudo rm -rf "$ANDROID_HOME/system-images" || true
          sudo rm -rf "$ANDROID_HOME/platforms" || true
          sudo rm -rf "$ANDROID_HOME/build-tools" || true
          sudo rm -rf "$ANDROID_HOME/sources" || true
          sudo rm -rf "$ANDROID_HOME/extras" || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true

          echo '=== After cleanup ==='
          df -h /
          du -sh "$ANDROID_HOME" 2>/dev/null || true

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Download exact APKs produced by the green build job
        uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Android-Step1-Runtime-Bundle
          path: step1-runtime

      - name: Verify runtime APK bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f step1-runtime/VideoFlow_Android_Step1_Debug.apk
          test -f step1-runtime/VideoFlow_Android_Step1_Debug-androidTest.apk
          (cd step1-runtime && sha256sum -c SHA256SUMS.txt)
          ls -lh step1-runtime

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$USER":"$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Pre-emulator storage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Filesystem ==='
          df -h / "$HOME" "$ANDROID_HOME"
          echo '=== Android SDK ==='
          du -sh "$ANDROID_HOME" 2>/dev/null || true
          FREE_KB=$(df --output=avail -k / | tail -1 | tr -d ' ')
          echo "Free root filesystem space: $((FREE_KB / 1024)) MiB"
          if [ "$FREE_KB" -lt 16777216 ]; then
            echo 'Less than 16 GiB is free before emulator provisioning; refusing to start an unreliable certification run.'
            exit 1
          fi

      - name: API 35 emulator instrumentation and Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disk-size: 1536M
          script: |
            set -euo pipefail
            mkdir -p step1-emulator-reports
            adb install -r step1-runtime/VideoFlow_Android_Step1_Debug.apk
            adb install -r step1-runtime/VideoFlow_Android_Step1_Debug-androidTest.apk
            set +e
            adb shell am instrument -w -r com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee step1-emulator-reports/instrumentation-output.txt
            TEST_EXIT=${PIPESTATUS[0]}
            set -e
            if [ "$TEST_EXIT" -ne 0 ]; then
              echo "Instrumentation command failed with exit code $TEST_EXIT"
              exit "$TEST_EXIT"
            fi
            if grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step1-emulator-reports/instrumentation-output.txt; then
              echo 'Instrumentation reported a test/runtime failure.'
              exit 1
            fi
            if ! grep -E -q 'OK \([0-9]+ tests?\)' step1-emulator-reports/instrumentation-output.txt; then
              echo 'Instrumentation did not report a complete successful test run.'
              exit 1
            fi

      - name: Package emulator test reports
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p step1-emulator-reports
          df -h / > step1-emulator-reports/final-disk-usage.txt || true
          adb devices -l > step1-emulator-reports/adb-devices.txt 2>/dev/null || true

      - name: Upload emulator certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-Step1-Emulator-Certification
          path: step1-emulator-reports
          if-no-files-found: warn
          retention-days: 30
