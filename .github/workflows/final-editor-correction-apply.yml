name: Apply Final Editor Correction

on:
  push:
    branches:
      - step5-final-hardening-certification
    paths:
      - scripts/apply_final_editor_corrections.py
      - .github/workflows/final-editor-correction-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-editor-correction-apply
  cancel-in-progress: false

jobs:
  apply-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: step5-final-hardening-certification
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          mkdir -p "$ANDROID_HOME/platforms"
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          sdkmanager 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --gradle-distribution-sha256-sum bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          chmod +x gradlew

      - name: Normalize current precise-trim toolbar shape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/videoflow/app/ui/editor/EditorChrome.kt')
          text = path.read_text(encoding='utf-8')
          current = '        ToolButton(Icons.Default.AccessTime, "Precise Trim") { onProfessionalTool(ProfessionalEditorTool.PreciseTrim(clipId)) }'
          matcher_shape = '        EditorToolbarItem("Precise Trim", Icons.Default.ContentCut, action = { onProfessionalTool(ProfessionalEditorTool.PreciseTrim(selection.videoClip.id)) })'
          if current in text:
              path.write_text(text.replace(current, matcher_shape), encoding='utf-8')
          elif matcher_shape not in text:
              raise SystemExit('Precise Trim toolbar item was not found in the expected current or normalized form')
          PY

      - name: Normalize current trim mutation shape for guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/videoflow/app/ui/ContextualEditingViewModel.kt')
          text = path.read_text(encoding='utf-8')
          current = '        if (sourceStartUs != before.sourceStartUs) editorRepository.trimClipStart(projectId, clipId, sourceStartUs)\n        if (sourceEndUs != before.sourceEndUs) editorRepository.trimClipEnd(projectId, clipId, sourceEndUs)'
          matcher_shape = '            if (sourceStartUs != before.sourceStartUs) editorRepository.trimClipStart(clipId, sourceStartUs)\n            if (sourceEndUs != before.sourceEndUs) editorRepository.trimClipEnd(clipId, sourceEndUs)'
          if current in text:
              path.write_text(text.replace(current, matcher_shape), encoding='utf-8')
          elif matcher_shape not in text:
              raise SystemExit('commitTrim mutation was not found in the expected current or normalized form')
          PY

      - name: Normalize current professional-panel phone modifier shape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/com/videoflow/app/ui/screens/Step4WatermarkEditorRoute.kt')
          text = path.read_text(encoding='utf-8')
          matcher_shape = 'Modifier.align(Alignment.BottomCenter).fillMaxWidth().heightIn(max = maxHeight * 0.82f)'
          if matcher_shape not in text:
              pattern = r'Modifier\s*\.align\(Alignment\.BottomCenter\)\s*\.fillMaxWidth\(\)\s*\.heightIn\(max = maxHeight \* 0\.82f\)'
              text, count = re.subn(pattern, matcher_shape, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Professional panel phone modifier match count was {count}, expected 1')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Apply deterministic correction patch
        run: python3 scripts/apply_final_editor_corrections.py

      - name: Restore current editor repository method signatures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/videoflow/app/ui/ContextualEditingViewModel.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('editorRepository.trimClipStart(clipId, sourceStartUs)', 'editorRepository.trimClipStart(projectId, clipId, sourceStartUs)')
          text = text.replace('editorRepository.trimClipEnd(clipId, sourceEndUs)', 'editorRepository.trimClipEnd(projectId, clipId, sourceEndUs)')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch formatting
        run: git diff --check

      - name: Compile corrected app and run JVM tests
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Commit corrected implementation
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No correction changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts/apply_final_editor_corrections.py
          git commit -m "fix: correct final editor physical-device blockers"
          git push origin HEAD:step5-final-hardening-certification

