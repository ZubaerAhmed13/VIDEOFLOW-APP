name: VideoFlow Android Step 3 Certification

on:
  push:
    branches: [ main, step3-native-rendering ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-certification:
    name: Step 1/2 regression, Step 3 unit, lint and APK certification
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37.0 platform and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          mkdir -p "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          sdkmanager 'build-tools;36.0.0'
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          rm -f /tmp/platform-37.0_r02.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0
          chmod +x gradlew
          ./gradlew --version

      - name: Generate deterministic media fixtures
        run: ./scripts/generate-test-fixtures.sh

      - name: Step 1-3 prohibited-pattern audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'inputStream\.readBytes\(\)|\.readBytes\(\)|ByteArray\([^)]*(fileSize|sizeBytes|file\.length)|WebView|android\.permission\.INTERNET|android\.permission\.MANAGE_EXTERNAL_STORAGE|fallbackToDestructiveMigration|ffmpeg\.wasm|FFmpeg-WASM' app/src/main app/src/main/AndroidManifest.xml; then
            echo 'Prohibited architecture pattern detected.'
            exit 1
          fi
          if grep -R -n -E 'TODO|FIXME|Coming Soon|Not Implemented' app/src/main; then
            echo 'Unfinished production marker detected.'
            exit 1
          fi

      - name: Verify Step 3 architecture contract and documents
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'data class FinalRenderPlan' app/src/main/java
          grep -R -q 'originalSources' app/src/main/java/com/videoflow/app
          grep -q 'SafMediaMuxerFactory' app/src/main/java/com/videoflow/app/render/Media3RenderEngine.kt
          grep -q 'setEnableFallback(false)' app/src/main/java/com/videoflow/app/render/Media3RenderEngine.kt
          grep -q 'usesTemporaryLocalOutput = false' app/src/main/java/com/videoflow/app/render/Media3RenderEngine.kt
          grep -q 'VALIDATION_FAILED' app/src/main/java/com/videoflow/app/render/Media3RenderEngine.kt
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROCESSING' app/src/main/AndroidManifest.xml
          for doc in QUALITY_AND_COLOUR_CERTIFICATION.md FINAL_RENDER_ENGINE.md FINAL_AUDIO_ENGINE.md EXPORT_ARCHITECTURE.md COLOUR_PIPELINE.md LARGE_MEDIA_EXPORT.md STEP_3_TEST_REPORT.md STEP_3_COMPLETION_REPORT.md STEP_3_PHYSICAL_DEVICE_CERTIFICATION.md; do
            test -s "$doc"
          done
          test -s scripts/step3-physical-certification.sh
          bash -n scripts/step3-physical-certification.sh

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Step 1/2 regression and Step 3 JVM tests
        run: ./gradlew test --stacktrace

      - name: Record exact JVM test counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          if not files:
              raise SystemExit('No JVM test result XML files found')
          for path in files:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, '0'))
          passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
          text = f"Unit: {passed} PASS / {totals['failures'] + totals['errors']} FAIL / {totals['skipped']} SKIP\nTotal listed: {totals['tests']}\n"
          print(text, end='')
          open('STEP_3_UNIT_TEST_COUNTS.txt', 'w', encoding='utf-8').write(text)
          if totals['failures'] or totals['errors']:
              raise SystemExit('JVM tests contain failures/errors')
          PY

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Compile Step 3 instrumentation tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble debug, instrumentation and test-signed release APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Prepare exact Step 3 runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_APK='app/build/outputs/apk/debug/app-debug.apk'
          TEST_APK='app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          RELEASE_APK='app/build/outputs/apk/release/app-release.apk'
          test -f "$APP_APK"
          test -f "$TEST_APK"
          test -f "$RELEASE_APK"
          mkdir -p step3-runtime
          cp "$APP_APK" step3-runtime/VideoFlow_Android_Step3_Debug.apk
          cp "$TEST_APK" step3-runtime/VideoFlow_Android_Step3_Debug-androidTest.apk
          cp "$RELEASE_APK" step3-runtime/VideoFlow_Android_Step3_Release.apk
          (cd step3-runtime && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Upload exact Step 3 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-Step3-Runtime-Bundle
          path: step3-runtime
          if-no-files-found: error
          retention-days: 30

      - name: Package Step 3 build certification artifacts
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p step3-deliverables/reports step3-deliverables/scripts
          [ ! -f app/build/outputs/apk/debug/app-debug.apk ] || cp app/build/outputs/apk/debug/app-debug.apk step3-deliverables/VideoFlow_Android_Step3_Debug.apk
          [ ! -f app/build/outputs/apk/release/app-release.apk ] || cp app/build/outputs/apk/release/app-release.apk step3-deliverables/VideoFlow_Android_Step3_Release.apk
          cp -R app/build/reports step3-deliverables/reports/app-build-reports 2>/dev/null || true
          for doc in QUALITY_AND_COLOUR_CERTIFICATION.md FINAL_RENDER_ENGINE.md FINAL_AUDIO_ENGINE.md EXPORT_ARCHITECTURE.md COLOUR_PIPELINE.md LARGE_MEDIA_EXPORT.md STEP_3_TEST_REPORT.md STEP_3_COMPLETION_REPORT.md STEP_3_PHYSICAL_DEVICE_CERTIFICATION.md; do
            [ ! -f "$doc" ] || cp "$doc" step3-deliverables/
          done
          [ ! -f scripts/step3-physical-certification.sh ] || cp scripts/step3-physical-certification.sh step3-deliverables/scripts/
          [ ! -f STEP_3_UNIT_TEST_COUNTS.txt ] || cp STEP_3_UNIT_TEST_COUNTS.txt step3-deliverables/
          {
            echo "GitHub SHA: ${GITHUB_SHA:-unknown}"
            echo "GitHub run: ${GITHUB_RUN_ID:-unknown}"
            echo "Workflow: ${GITHUB_WORKFLOW:-unknown}"
            echo "Automated build/emulator gates can pass in CI."
            echo "Overall Step 3 COMPLETE additionally requires the mandatory physical-device gates recorded in STEP_3_PHYSICAL_DEVICE_CERTIFICATION.md."
          } > step3-deliverables/CI_CERTIFICATION.txt
          git archive --format=zip --output=step3-deliverables/VideoFlow_Android_Step3_Source.zip HEAD || true
          cd step3-deliverables
          : > SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 -r sha256sum >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Step 3 build certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-Step3-Build-Certification
          path: step3-deliverables
          if-no-files-found: error
          retention-days: 30

  emulator-certification:
    name: API 35 Step 3 native render instrumentation certification
    needs: build-certification
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/system-images" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/sources" "$ANDROID_HOME/extras" || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Download exact APKs produced by build job
        uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Android-Step3-Runtime-Bundle
          path: step3-runtime

      - name: Verify runtime bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f step3-runtime/VideoFlow_Android_Step3_Debug.apk
          test -f step3-runtime/VideoFlow_Android_Step3_Debug-androidTest.apk
          test -f step3-runtime/VideoFlow_Android_Step3_Release.apk
          (cd step3-runtime && sha256sum -c SHA256SUMS.txt)

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$USER":"$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm

      - name: API 35 instrumentation including direct SAF native render
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disk-size: 2048M
          script: |
            mkdir -p step3-emulator-reports
            adb install -r step3-runtime/VideoFlow_Android_Step3_Debug.apk
            adb install -r step3-runtime/VideoFlow_Android_Step3_Debug-androidTest.apk
            adb shell am instrument -w -r com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step3-emulator-reports/instrumentation-output.txt 2>&1
            cat step3-emulator-reports/instrumentation-output.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step3-emulator-reports/instrumentation-output.txt
            grep -E -q 'OK \([0-9]+ tests?\)' step3-emulator-reports/instrumentation-output.txt
            grep -E 'OK \([0-9]+ tests?\)' step3-emulator-reports/instrumentation-output.txt | tail -n1 | sed -E 's/.*OK \(([0-9]+) tests?\).*/Instrumentation: \1 PASS \/ 0 FAIL/' | tee step3-emulator-reports/STEP_3_INSTRUMENTATION_COUNTS.txt
            test -s step3-emulator-reports/STEP_3_INSTRUMENTATION_COUNTS.txt

      - name: Upload Step 3 emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-Step3-Emulator-Certification
          path: step3-emulator-reports
          if-no-files-found: warn
          retention-days: 30
