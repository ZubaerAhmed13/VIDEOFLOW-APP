name: VideoFlow UX Step 2 Correction Apply

on:
  push:
    branches:
      - ux-step2-trim-speed-crop
    paths:
      - scripts/ux_step2/fix_step2_compile_and_geometry.py
      - .github/workflows/ux-step2-correction-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-step2-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify certified Step 1 ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE='0123b734f687dfdbf0589b6040aeb4d8642c5968'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

      - name: Apply deterministic correction
        run: python scripts/ux_step2/fix_step2_compile_and_geometry.py

      - name: Validate correction invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q 'CropRect.FULL' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          grep -q 'fadeInUs = clip.fadeInUs.coerceAtMost(newDurationUs)' app/src/main/java/com/videoflow/app/domain/editor/TimelineEngine.kt
          grep -q 'aspectCropAroundCurrentCenter' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
          grep -q 'String.format(java.util.Locale.US, "%.2f", value)' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt \
            app/src/main/java/com/videoflow/app/domain/editor/TimelineEngine.kt \
            app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt \
            app/src/test/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropCoreTest.kt
          if git diff --cached --quiet; then
            echo 'Correction already applied.'
            exit 0
          fi
          git commit -m 'Fix Step 2 crop compile and geometry invariants'
          git push origin HEAD:ux-step2-trim-speed-crop
