name: Fix all persistent AI save scroll assertions

on:
  push:
    branches:
      - step5-final-hardening-certification
    paths:
      - .github/workflows/fix-all-persistent-ai-save-scroll-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard and correct persistent AI save assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/androidTest/java')
          old = 'rule.onNodeWithContentDescription("Save AI removal").assertIsEnabled().performScrollTo().performClick()'
          new = 'rule.onNodeWithContentDescription("Save AI removal").assertIsDisplayed().assertIsEnabled().performClick()'

          files = list(root.rglob('*.kt'))
          exact = []
          bad = []
          for path in files:
              text = path.read_text()
              if old in text:
                  exact.append(path)
              for line_no, line in enumerate(text.splitlines(), 1):
                  if 'Save AI removal' in line and 'performScrollTo' in line:
                      bad.append((path, line_no, line.strip()))

          if len(exact) != 1:
              raise SystemExit(f'Expected exactly one remaining exact stale Save AI removal scroll assertion, found {len(exact)}: {exact}')
          if len(bad) != 1:
              raise SystemExit(f'Expected exactly one remaining Save AI removal scroll usage, found {len(bad)}: {bad}')

          path = exact[0]
          text = path.read_text()
          text = text.replace(old, new, 1)
          path.write_text(text)

          remaining = []
          new_count = 0
          for candidate in files:
              current = candidate.read_text()
              new_count += current.count(new)
              for line_no, line in enumerate(current.splitlines(), 1):
                  if 'Save AI removal' in line and 'performScrollTo' in line:
                      remaining.append((candidate, line_no, line.strip()))
          if remaining:
              raise SystemExit(f'Stale persistent-save scroll assumptions remain: {remaining}')
          if new_count < 2:
              raise SystemExit(f'Expected at least two displayed+enabled persistent-save product assertions after correction, found {new_count}')
          print(f'Corrected {path}; repository now has {new_count} displayed+enabled persistent-save assertions and zero scroll assumptions.')
          PY
      - name: Compile corrected instrumentation sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugAndroidTestKotlin
      - name: Commit exact duplicate assertion correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/androidTest/java
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --cached --name-only)" = "app/src/androidTest/java/com/videoflow/app/ui/ProfessionalProductWorkflowTest.kt"
          git diff --cached --check
          git commit -m 'test: certify persistent AI save in retained product workflow'
          git push origin HEAD:step5-final-hardening-certification
