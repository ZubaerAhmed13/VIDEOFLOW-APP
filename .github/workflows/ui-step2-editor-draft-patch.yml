name: UI Step 2 editor draft integration patch

on:
  push:
    branches: [ui-step2-contextual-tools]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot editor draft integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-step2-contextual-tools
          fetch-depth: 0
      - name: Integrate transient draft with editor screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt')
          s = p.read_text()

          s = s.replace('import com.videoflow.app.domain.editor.ImageOverlay\n', 'import com.videoflow.app.domain.editor.ImageOverlay\nimport com.videoflow.app.domain.editor.KeyframeEvaluator\nimport com.videoflow.app.domain.editor.KeyframeProperty\n')
          s = s.replace('import com.videoflow.app.ui.editor.ContextualToolHost\n', 'import com.videoflow.app.ui.editor.ContextualPreviewDraft\nimport com.videoflow.app.ui.editor.ContextualToolHost\n')
          s = s.replace('import com.videoflow.app.ui.editor.PreviewWorkspace\n', 'import com.videoflow.app.ui.editor.PreviewTextStyleDraft\nimport com.videoflow.app.ui.editor.PreviewTransformDraft\nimport com.videoflow.app.ui.editor.PreviewWorkspace\n')
          s = s.replace('import kotlinx.coroutines.delay\n', 'import kotlinx.coroutines.delay\nimport kotlin.math.abs\n')

          s = s.replace(
              '    var activeTool by remember { mutableStateOf<EditorTool?>(null) }\n',
              '    var activeTool by remember { mutableStateOf<EditorTool?>(null) }\n    var previewDraft by remember { mutableStateOf(ContextualPreviewDraft()) }\n',
              1
          )
          s = s.replace(
              '        activeTool = null\n        initialToolClip = null',
              '        activeTool = null\n        previewDraft = ContextualPreviewDraft()\n        initialToolClip = null',
              1
          )

          open_tool = r'''    fun openTool(tool: EditorTool) {
                  activePanel = null
                  activeTool = tool
                  previewDraft = ContextualPreviewDraft()
                  initialToolClip = null
                  initialToolText = null
                  initialToolImage = null

                  fun value(ownerId: String, property: KeyframeProperty, base: Float, startUs: Long, durationUs: Long): Float {
                      val localUs = (playheadUs - startUs).coerceIn(0L, durationUs.coerceAtLeast(1L))
                      val frames = timeline?.keyframes.orEmpty().filter { it.ownerId == ownerId && it.property == property }
                      return KeyframeEvaluator.evaluate(base, localUs, frames)
                  }

                  val ownerId = when (tool) {
                      is EditorTool.Trim -> tool.clipId
                      is EditorTool.Speed -> tool.clipId
                      is EditorTool.Crop -> tool.clipId
                      is EditorTool.Volume -> tool.clipId
                      is EditorTool.Fade -> tool.clipId
                      is EditorTool.Transform -> tool.ownerId
                      is EditorTool.Opacity -> tool.ownerId
                      is EditorTool.TextEditor -> tool.overlayId
                      is EditorTool.TextStyle -> tool.overlayId
                      is EditorTool.Timing -> tool.ownerId
                      is EditorTool.Keyframes -> tool.ownerId
                      is EditorTool.More -> tool.ownerId
                  }

                  when (tool) {
                      is EditorTool.Trim, is EditorTool.Speed, is EditorTool.Crop, is EditorTool.Volume, is EditorTool.Fade -> {
                          initialToolClip = ownerId?.let { idValue -> clips.firstOrNull { it.id == idValue } }
                          initialToolClip?.let { clip ->
                              vm.selectClip(clip.id)
                              if (playheadUs !in clip.timelineStartUs until clip.timelineEndUs) vm.setPlayheadUs(clip.timelineStartUs)
                              when (tool) {
                                  is EditorTool.Crop -> previewDraft = ContextualPreviewDraft(crop = clip.transform.crop)
                                  is EditorTool.Volume -> previewDraft = ContextualPreviewDraft(
                                      gainDb = value(clip.id, KeyframeProperty.AUDIO_GAIN, clip.gainDb, clip.timelineStartUs, clip.timelineDurationUs)
                                  )
                                  is EditorTool.Fade -> previewDraft = ContextualPreviewDraft(fadeInUs = clip.fadeInUs, fadeOutUs = clip.fadeOutUs)
                                  else -> Unit
                              }
                          }
                      }
                      is EditorTool.Transform -> when (tool.ownerType) {
                          VisualOwnerType.CLIP -> clips.firstOrNull { it.id == tool.ownerId }?.let { clip ->
                              initialToolClip = clip
                              val duration = clip.timelineDurationUs
                              previewDraft = ContextualPreviewDraft(transform = PreviewTransformDraft(
                                  x = value(clip.id, KeyframeProperty.POSITION_X, clip.transform.x, clip.timelineStartUs, duration),
                                  y = value(clip.id, KeyframeProperty.POSITION_Y, clip.transform.y, clip.timelineStartUs, duration),
                                  scaleX = value(clip.id, KeyframeProperty.SCALE_X, clip.transform.scaleX, clip.timelineStartUs, duration),
                                  scaleY = value(clip.id, KeyframeProperty.SCALE_Y, clip.transform.scaleY, clip.timelineStartUs, duration),
                                  rotationDegrees = value(clip.id, KeyframeProperty.ROTATION, clip.transform.rotationDegrees, clip.timelineStartUs, duration),
                                  flipHorizontal = clip.transform.flipHorizontal,
                                  flipVertical = clip.transform.flipVertical
                              ))
                          }
                          VisualOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay ->
                              initialToolText = overlay
                              val duration = overlay.timelineEndUs - overlay.timelineStartUs
                              previewDraft = ContextualPreviewDraft(transform = PreviewTransformDraft(
                                  value(overlay.id, KeyframeProperty.POSITION_X, overlay.transform.x, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.POSITION_Y, overlay.transform.y, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.SCALE_X, overlay.transform.scaleX, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.SCALE_Y, overlay.transform.scaleY, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.ROTATION, overlay.transform.rotationDegrees, overlay.timelineStartUs, duration)
                              ))
                          }
                          VisualOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay ->
                              initialToolImage = overlay
                              val duration = overlay.timelineEndUs - overlay.timelineStartUs
                              previewDraft = ContextualPreviewDraft(transform = PreviewTransformDraft(
                                  value(overlay.id, KeyframeProperty.POSITION_X, overlay.transform.x, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.POSITION_Y, overlay.transform.y, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.SCALE_X, overlay.transform.scaleX, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.SCALE_Y, overlay.transform.scaleY, overlay.timelineStartUs, duration),
                                  value(overlay.id, KeyframeProperty.ROTATION, overlay.transform.rotationDegrees, overlay.timelineStartUs, duration)
                              ))
                          }
                      }
                      is EditorTool.Opacity -> when (tool.ownerType) {
                          VisualOwnerType.CLIP -> clips.firstOrNull { it.id == tool.ownerId }?.let { clip ->
                              initialToolClip = clip
                              previewDraft = ContextualPreviewDraft(opacity = value(clip.id, KeyframeProperty.OPACITY, clip.opacity, clip.timelineStartUs, clip.timelineDurationUs))
                          }
                          VisualOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay ->
                              initialToolText = overlay
                              previewDraft = ContextualPreviewDraft(opacity = value(overlay.id, KeyframeProperty.OPACITY, overlay.opacity, overlay.timelineStartUs, overlay.timelineEndUs - overlay.timelineStartUs))
                          }
                          VisualOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { overlay ->
                              initialToolImage = overlay
                              previewDraft = ContextualPreviewDraft(opacity = value(overlay.id, KeyframeProperty.OPACITY, overlay.transform.opacity, overlay.timelineStartUs, overlay.timelineEndUs - overlay.timelineStartUs))
                          }
                      }
                      is EditorTool.TextEditor -> {
                          initialToolText = tool.overlayId?.let { owner -> timeline?.textOverlays?.firstOrNull { it.id == owner } }
                          previewDraft = ContextualPreviewDraft(textContent = initialToolText?.content.orEmpty())
                      }
                      is EditorTool.TextStyle -> timeline?.textOverlays?.firstOrNull { it.id == tool.overlayId }?.let { overlay ->
                          initialToolText = overlay
                          previewDraft = ContextualPreviewDraft(textStyle = PreviewTextStyleDraft(
                              overlay.fontSizeSp, overlay.fontWeight, overlay.italic, overlay.alignment, overlay.colorArgb
                          ))
                      }
                      is EditorTool.Timing, is EditorTool.Keyframes, is EditorTool.More -> Unit
                  }

                  when (tool) {
                      is EditorTool.Trim, is EditorTool.Crop, is EditorTool.TextEditor, is EditorTool.TextStyle, is EditorTool.Transform -> isPlaying = false
                      else -> Unit
                  }
                  val ownerWindow = when (tool) {
                      is EditorTool.Transform -> when (tool.ownerType) {
                          VisualOwnerType.CLIP -> clips.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                          VisualOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                          VisualOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                      }
                      is EditorTool.Opacity -> when (tool.ownerType) {
                          VisualOwnerType.CLIP -> clips.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                          VisualOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                          VisualOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                      }
                      is EditorTool.TextEditor -> tool.overlayId?.let { owner -> timeline?.textOverlays?.firstOrNull { it.id == owner }?.let { it.timelineStartUs to it.timelineEndUs } }
                      is EditorTool.TextStyle -> timeline?.textOverlays?.firstOrNull { it.id == tool.overlayId }?.let { it.timelineStartUs to it.timelineEndUs }
                      is EditorTool.Timing -> when (tool.ownerType) {
                          com.videoflow.app.ui.editor.TimedOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                          com.videoflow.app.ui.editor.TimedOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                      }
                      is EditorTool.Keyframes -> when (tool.ownerType) {
                          VisualOwnerType.CLIP -> clips.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                          VisualOwnerType.TEXT -> timeline?.textOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                          VisualOwnerType.IMAGE -> timeline?.imageOverlays?.firstOrNull { it.id == tool.ownerId }?.let { it.timelineStartUs to it.timelineEndUs }
                      }
                      else -> null
                  }
                  ownerWindow?.let { (start, end) -> if (playheadUs !in start until end) vm.setPlayheadUs(start) }
              }

              fun cancelActiveTool() {
                  // All preview-then-commit tools keep edits in ContextualPreviewDraft until Done.
                  // Keyframe/More actions are explicit live actions and expose Close rather than Cancel.
                  clearToolSession()
              }

              fun closeOrBack'''
          s, n = re.subn(r'    fun openTool\(tool: EditorTool\) \{.*?\n    fun closeOrBack', open_tool, s, count=1, flags=re.S)
          assert n == 1, 'open/cancel replacement failed'

          transform = r'''    fun transformGesture(dx: Float, dy: Float, zoom: Float, rotation: Float) {
                  val tool = activeTool as? EditorTool.Transform ?: return
                  val current = previewDraft.transform ?: return
                  val rawX = (current.x + dx).coerceIn(0f, 1f)
                  val rawY = (current.y + dy).coerceIn(0f, 1f)
                  val snappedX = if (abs(rawX - 0.5f) < 0.018f) 0.5f else rawX
                  val snappedY = if (abs(rawY - 0.5f) < 0.018f) 0.5f else rawY
                  val nextScaleX = (current.scaleX * zoom).coerceIn(0.05f, 10f)
                  val nextScaleY = (current.scaleY * zoom).coerceIn(0.05f, 10f)
                  previewDraft = previewDraft.copy(transform = current.copy(
                      x = snappedX,
                      y = snappedY,
                      scaleX = nextScaleX,
                      scaleY = nextScaleY,
                      rotationDegrees = current.rotationDegrees + rotation
                  ))
              }

              BackHandler'''
          s, n = re.subn(r'    fun transformGesture\(dx: Float, dy: Float, zoom: Float, rotation: Float\) \{.*?\n    BackHandler', transform, s, count=1, flags=re.S)
          assert n == 1, 'transform gesture replacement failed'

          old_preview = '''                            project, editor, playheadUs, isPlaying, Modifier.weight(1f), activeTool,
                            onCropChange = { crop ->
                                (activeTool as? EditorTool.Crop)?.let { tool -> contextualVm.setClipCrop(id, tool.clipId, crop) { vm.load(id) } }
                            },
                            onTransformGesture = ::transformGesture'''
          new_preview = '''                            project, editor, playheadUs, isPlaying, Modifier.weight(1f), activeTool, previewDraft,
                            onCropChange = { crop -> previewDraft = previewDraft.copy(crop = crop) },
                            onCropCommit = { },
                            onTransformGesture = ::transformGesture,
                            onTransformGestureEnd = { }'''
          assert old_preview in s
          s = s.replace(old_preview, new_preview, 1)

          old_preview2 = '''                            project, editor, playheadUs, isPlaying, Modifier.weight(0.70f), activeTool,
                            onCropChange = { crop ->
                                (activeTool as? EditorTool.Crop)?.let { tool -> contextualVm.setClipCrop(id, tool.clipId, crop) { vm.load(id) } }
                            },
                            onTransformGesture = ::transformGesture'''
          new_preview2 = '''                            project, editor, playheadUs, isPlaying, Modifier.weight(0.70f), activeTool, previewDraft,
                            onCropChange = { crop -> previewDraft = previewDraft.copy(crop = crop) },
                            onCropCommit = { },
                            onTransformGesture = ::transformGesture,
                            onTransformGestureEnd = { }'''
          assert old_preview2 in s
          s = s.replace(old_preview2, new_preview2, 1)

          old_preview3 = '''                        project, editor, playheadUs, isPlaying, Modifier.weight(0.42f), activeTool,
                        onCropChange = { crop ->
                            (activeTool as? EditorTool.Crop)?.let { tool -> contextualVm.setClipCrop(id, tool.clipId, crop) { vm.load(id) } }
                        },
                        onTransformGesture = ::transformGesture'''
          new_preview3 = '''                        project, editor, playheadUs, isPlaying, Modifier.weight(0.42f), activeTool, previewDraft,
                        onCropChange = { crop -> previewDraft = previewDraft.copy(crop = crop) },
                        onCropCommit = { },
                        onTransformGesture = ::transformGesture,
                        onTransformGestureEnd = { }'''
          assert old_preview3 in s
          s = s.replace(old_preview3, new_preview3, 1)

          s = s.replace(
              '        overlayVm = overlayVm,\n        onDismiss = ::clearToolSession,',
              '        overlayVm = overlayVm,\n        previewDraft = previewDraft,\n        onPreviewDraftChange = { previewDraft = it },\n        onDismiss = ::clearToolSession,',
              1
          )

          p.write_text(s)
          PY

          git diff --check
          git config user.name 'Zubaer Ahmed'
          git config user.email 'zubaerknight@gmail.com'
          git add app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt
          git commit -m 'Integrate transient preview drafts into editor workspace'
          git push origin ui-step2-contextual-tools
