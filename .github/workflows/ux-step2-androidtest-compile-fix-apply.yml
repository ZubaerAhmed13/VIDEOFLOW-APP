name: UX Step 2 AndroidTest Compile Fix Apply

on:
  push:
    branches:
      - ux-step2-trim-speed-crop
    paths:
      - .github/workflows/ux-step2-androidtest-compile-fix-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-step2-trim-speed-crop
          fetch-depth: 0
      - name: Replace unsupported Compose assertion
        shell: bash
        run: >-
          python -c 'from pathlib import Path; p=Path("app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt"); s=p.read_text(); assert "import androidx.compose.ui.test.assertExists\n" in s, "assertExists import missing"; assert ".assertExists()" in s, "assertExists calls missing"; s=s.replace("import androidx.compose.ui.test.assertExists\n", "").replace(".assertExists()", ".assertIsDisplayed()"); p.write_text(s)'
      - name: Verify stronger UI assertions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q 'assertExists' app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt
          grep -q 'assertIsDisplayed' app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt
          git diff -- app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt
      - name: Commit test compile correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VideoFlow Step 2 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt
          git commit -m 'Fix Step 2 Compose test assertions'
          git push origin HEAD:ux-step2-trim-speed-crop
