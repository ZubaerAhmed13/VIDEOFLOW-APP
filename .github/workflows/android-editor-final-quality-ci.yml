name: VideoFlow Android Final Editor Quality Certification

on:
  push:
    branches:
      - editor-final-quality-source-preservation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-editor-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-regression-package:
    name: Final editor quality, regression and APK packaging
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          mkdir -p "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          sdkmanager 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Restore stable Review signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -s ci/review-test.keystore.b64
          base64 --decode ci/review-test.keystore.b64 > ci/review-test.keystore
          chmod 600 ci/review-test.keystore
          FINGERPRINT=$(keytool -list -v -keystore ci/review-test.keystore -storepass videoflow-review -alias videoflow-review | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')
          test "$FINGERPRINT" = 'F3:D4:E6:6B:35:08:00:BC:A7:39:B2:C5:F6:F4:D2:C7:F1:5C:7D:C8:9B:1B:87:63:BD:51:46:8A:B7:15:0C:C7'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0
          chmod +x gradlew
          ./gradlew --version

      - name: Final editor architecture and privacy audit
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/videoflow/app/domain/editor/TrimTimecode.kt
          test -s app/src/main/java/com/videoflow/app/domain/editor/PreviewPlaybackPolicy.kt
          test -s app/src/main/java/com/videoflow/app/domain/export/SourcePreservation.kt
          test -s app/src/main/java/com/videoflow/app/render/SmartCopyEngine.kt
          test -s app/src/main/java/com/videoflow/app/ui/screens/MergeVideosScreen.kt
          test -s app/src/main/java/com/videoflow/app/ui/screens/FinalQualityEditorRoute.kt
          test -s app/src/main/java/com/videoflow/app/ui/screens/FinalQualityExportRoute.kt
          grep -q 'Merge Videos' app/src/main/java/com/videoflow/app/ui/screens/FinalQualityHomeRoute.kt
          grep -q 'No rendered fallback was started' app/src/main/java/com/videoflow/app/export/ExportCoordinator.kt
          grep -q 'Smart Copy (no video re-encoding)' app/src/main/java/com/videoflow/app/export/ExportCoordinator.kt
          grep -q 'MATCH_SOURCE' app/src/main/java/com/videoflow/app/domain/export/ExportModels.kt
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -q 'WebView' app/src/main/java
          ! grep -R -qE 'FirebaseAnalytics|Crashlytics|Sentry|Mixpanel|Amplitude|Segment' app/src/main/java app/build.gradle.kts
          ! grep -R -qE 'Watermark.*Coming Soon|Coming Soon.*Watermark' app/src/main/java
          ! grep -R -qE 'readBytes\(\)|ByteArray\([^)]*source' app/src/main/java

      - name: Step 1, Step 2, Step 3, UI and final-quality unit regression
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Compile instrumentation and Compose tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble Debug, Review, Release and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleReview assembleRelease --stacktrace

      - name: Verify Review package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/review/app-review.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee review-badging.txt
          grep -q "package: name='com.videoflow.app.review'" review-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee review-signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: f3d4e66b350800bca739b2c5f6f4d2c7f15c7dc89b1b8763bd51468ab7150cc7' review-signature.txt

      - name: Package final editor quality APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-editor-artifacts final-editor-runtime
          cp app/build/outputs/apk/debug/app-debug.apk final-editor-artifacts/VideoFlow_Android_FinalEditorQuality_Debug.apk
          cp app/build/outputs/apk/review/app-review.apk final-editor-artifacts/VideoFlow_Android_FinalEditorQuality_Review.apk
          cp app/build/outputs/apk/release/app-release.apk final-editor-artifacts/VideoFlow_Android_FinalEditorQuality_Release.apk
          cp review-badging.txt review-signature.txt final-editor-artifacts/
          for DOC in PLAYBACK_PERFORMANCE_ARCHITECTURE.md PRECISE_TRIM_ARCHITECTURE.md MERGE_VIDEO_ARCHITECTURE.md SOURCE_PRESERVATION_EXPORT.md EDITOR_CONTRAST_ACCESSIBILITY_AUDIT.md STEP_4_AI_WATERMARK_STUDIO_HANDOFF.md FINAL_EDITOR_QUALITY_TEST_REPORT.md FINAL_EDITOR_QUALITY_PHYSICAL_REVIEW.md FINAL_EDITOR_QUALITY_COMPLETION_REPORT.md; do
            test -f "$DOC" && cp "$DOC" final-editor-artifacts/
          done
          (cd final-editor-artifacts && sha256sum *.apk | tee SHA256SUMS.txt)
          cp app/build/outputs/apk/debug/app-debug.apk final-editor-runtime/VideoFlow_Android_FinalEditorQuality_Debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk final-editor-runtime/VideoFlow_Android_FinalEditorQuality_Debug-androidTest.apk
          cp app/build/outputs/apk/review/app-review.apk final-editor-runtime/VideoFlow_Android_FinalEditorQuality_Review.apk
          (cd final-editor-runtime && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload final editor APKs and reports
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-FinalEditorQuality-APKs
          path: final-editor-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact API 35 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-FinalEditorQuality-Runtime-Bundle
          path: final-editor-runtime/
          if-no-files-found: error
          retention-days: 30

  api35-emulator-certification:
    name: API 35 editor, Review install and regression certification
    needs: build-regression-package
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/system-images" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/sources" "$ANDROID_HOME/extras" || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Download exact runtime bundle from Job 1
        uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Android-FinalEditorQuality-Runtime-Bundle
          path: final-editor-runtime

      - name: Verify exact runtime bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd final-editor-runtime && sha256sum -c SHA256SUMS.txt)

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$USER":"$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm

      - name: API 35 product/editor regression and Review install/update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disk-size: 1536M
          script: |
            set -e
            mkdir -p final-editor-emulator-reports
            adb install -r final-editor-runtime/VideoFlow_Android_FinalEditorQuality_Debug.apk
            adb install -r final-editor-runtime/VideoFlow_Android_FinalEditorQuality_Debug-androidTest.apk
            adb shell am instrument -w -r -e class com.videoflow.app.ui.HomeComposeTest,com.videoflow.app.ui.EditorWorkspaceVisualCertificationTest,com.videoflow.app.ui.LongTimelineWorkspaceSmokeTest,com.videoflow.app.ui.ContextualToolbarComposeTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > final-editor-emulator-reports/instrumentation-output.txt 2>&1
            cat final-editor-emulator-reports/instrumentation-output.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' final-editor-emulator-reports/instrumentation-output.txt
            grep -E -q 'OK \([0-9]+ tests?\)' final-editor-emulator-reports/instrumentation-output.txt
            adb uninstall com.videoflow.app.review >/dev/null 2>&1 || true
            adb install final-editor-runtime/VideoFlow_Android_FinalEditorQuality_Review.apk | tee final-editor-emulator-reports/review-fresh-install.txt
            grep -q 'Success' final-editor-emulator-reports/review-fresh-install.txt
            adb shell monkey -p com.videoflow.app.review -c android.intent.category.LAUNCHER 1 > final-editor-emulator-reports/review-cold-launch.txt
            sleep 2
            adb shell pidof com.videoflow.app.review | tee -a final-editor-emulator-reports/review-cold-launch.txt
            adb install -r final-editor-runtime/VideoFlow_Android_FinalEditorQuality_Review.apk | tee final-editor-emulator-reports/review-in-place-update.txt
            grep -q 'Success' final-editor-emulator-reports/review-in-place-update.txt
            adb shell monkey -p com.videoflow.app.review -c android.intent.category.LAUNCHER 1 >> final-editor-emulator-reports/review-in-place-update.txt
            sleep 2
            adb shell pidof com.videoflow.app.review | tee -a final-editor-emulator-reports/review-in-place-update.txt

      - name: Upload API 35 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-FinalEditorQuality-API35-Certification
          path: final-editor-emulator-reports/
          if-no-files-found: warn
          retention-days: 30
