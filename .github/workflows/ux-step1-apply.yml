name: Apply UX Step 1 Editor Shell

on:
  push:
    branches:
      - ux-step1-editor-shell-layout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-step1-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'ux: reconstruct editor shell Step 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ux-step1-editor-shell-layout
          fetch-depth: 0

      - name: Detect whether production patch is already applied
        id: state
        shell: bash
        run: |
          if grep -q 'val workspaceMode: EditorWorkspaceMode' app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply asserted editor-shell patch
        if: steps.state.outputs.applied != 'true'
        run: python3 scripts/ux_step1/apply_editor_shell.py

      - name: Verify patch shape
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'EditorWorkspaceMode.FocusedTool' app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt
          grep -q 'FocusedEditorWorkspace' app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt
          grep -q 'timeline-track-viewport' app/src/main/java/com/videoflow/app/ui/editor/TimelineWorkspace.kt
          grep -q 'registerFocusedToolActions' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
          ! grep -A30 '^    EditorPanelHost(' app/src/main/java/com/videoflow/app/ui/screens/EditorScreen.kt | grep -q '^    ContextualToolHost('

      - name: Commit exact production implementation
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VideoFlow UX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/videoflow/app/ui
          git commit -m 'ux: reconstruct editor shell Step 1'
          git push origin HEAD:ux-step1-editor-shell-layout
