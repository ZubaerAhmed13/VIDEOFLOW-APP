name: VideoFlow Step 5 Final Software Certification

on:
  push:
    branches:
      - step5-final-hardening-certification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step5-final-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  step4-build:
    name: Step 4 local AI compile, regression and Review APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          mkdir -p "$ANDROID_HOME/platforms"
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          sdkmanager 'build-tools;36.0.0'

      - name: Restore stable Review signing identity
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/review-test.keystore.b64 > ci/review-test.keystore
          chmod 600 ci/review-test.keystore
          FINGERPRINT=$(keytool -list -v -keystore ci/review-test.keystore -storepass videoflow-review -alias videoflow-review | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')
          test "$FINGERPRINT" = 'F3:D4:E6:6B:35:08:00:BC:A7:39:B2:C5:F6:F4:D2:C7:F1:5C:7D:C8:9B:1B:87:63:BD:51:46:8A:B7:15:0C:C7'

      - name: Stage checksum-pinned dual LaMa Android asset pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          FIXED_URL='https://huggingface.co/g-ronimo/lama/resolve/main/lama_512_int8.onnx?download=true'
          FIXED_SHA='cab19978adc306622fe37ef60d4a52103b99c98141d499c2a2366a7ed1255dbe'
          FIXED_SIZE='62074990'
          DYNAMIC_URL='https://huggingface.co/g-ronimo/lama/resolve/main/lama_int8.onnx?download=true'
          DYNAMIC_SHA='1941214c210399eb815eb2d32570ba91d5e6c4ac3de4c939bd3fb09300454972'
          DYNAMIC_SIZE='61512617'
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 600 -o app/src/main/assets/models/lama-512-int8.onnx "$FIXED_URL"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 600 -o app/src/main/assets/models/lama-dynamic-int8.onnx "$DYNAMIC_URL"
          echo "$FIXED_SHA  app/src/main/assets/models/lama-512-int8.onnx" | sha256sum --check --strict
          echo "$DYNAMIC_SHA  app/src/main/assets/models/lama-dynamic-int8.onnx" | sha256sum --check --strict
          test "$(stat -c '%s' app/src/main/assets/models/lama-512-int8.onnx)" = "$FIXED_SIZE"
          test "$(stat -c '%s' app/src/main/assets/models/lama-dynamic-int8.onnx)" = "$DYNAMIC_SIZE"

      - name: Generate deterministic androidTest video fixture
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=30 \
            -f lavfi -i sine=frequency=880:sample_rate=48000 \
            -t 2 -shortest \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            app/src/androidTest/assets/sample_av.mp4
          test -s app/src/androidTest/assets/sample_av.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 app/src/androidTest/assets/sample_av.mp4 | tee androidtest-video-fixture.txt
          grep -q 'codec_name=h264' androidtest-video-fixture.txt
          grep -q 'width=320' androidtest-video-fixture.txt
          grep -q 'height=240' androidtest-video-fixture.txt

      - name: Generate colour and A/V event fixtures
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=320x240:rate=30,drawbox=x=220:y=120:w=80:h=50:color=0xc68663:t=fill,drawbox=x=220:y=180:w=80:h=40:color=gray:t=fill" -f lavfi -i sine=frequency=880:sample_rate=48000 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/step5-colour.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=black:size=320x240:rate=30,drawbox=color=white:t=fill:enable='between(t,0.6,0.68)+between(t,1.5,1.58)'" -f lavfi -i "aevalsrc=0.7*sin(2*PI*1000*t)*(between(t\,0.6\,0.68)+between(t\,1.5\,1.58)):s=48000" -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/step5-sync.mp4

      - name: Generate variable timestamp source
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=30 -f lavfi -i sine=frequency=880:sample_rate=48000 -vf "select='if(lt(t,1),not(mod(n,2)),1)'" -fps_mode vfr -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/step5-vfr.mp4

      - name: Generate stereo 44.1 kHz source
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=30 -f lavfi -i "aevalsrc=0.5*sin(2*PI*1000*t)|0.5*sin(2*PI*500*t):s=44100" -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/step5-44100.mp4

      - name: Prepare retained Step 1-3 media fixtures
        run: |
          mkdir -p app/src/debug/assets
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=30 -f lavfi -i sine=frequency=1000:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/debug/assets/sample_av.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=30000/1001 -t 3 -c:v libx264 -pix_fmt yuv420p -an app/src/debug/assets/sample_video_only.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=240x320:rate=30 -t 3 -c:v libx264 -pix_fmt yuv420p -an app/src/debug/assets/sample_rotated.mp4
          python -c 'from pathlib import Path; Path("app/src/debug/assets/malformed.mp4").write_bytes(bytes(1024))'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --gradle-distribution-sha256-sum bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          chmod +x gradlew

      - name: Step 4 architecture, product-entry and privacy audit
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/videoflow/app/domain/ai/WatermarkModels.kt
          test -s app/src/main/java/com/videoflow/app/data/ai/AiWatermarkRepository.kt
          test -s app/src/main/java/com/videoflow/app/ai/watermark/AiModelPackManager.kt
          test -s app/src/main/java/com/videoflow/app/ai/watermark/LocalWatermarkPreviewEngine.kt
          test -s app/src/main/java/com/videoflow/app/ai/watermark/LocalRoiTracker.kt
          test -s app/src/main/java/com/videoflow/app/ai/watermark/OnnxWatermarkEffect.kt
          test -s app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt
          test -s app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioViewModel.kt
          test -s app/src/main/java/com/videoflow/app/ui/screens/Step4WatermarkEditorRoute.kt
          test -s app/src/androidTest/java/com/videoflow/app/ai/Step4AiFinalExportInstrumentedTest.kt
          grep -q 'AI Watermark' app/src/main/java/com/videoflow/app/ui/screens/Step4WatermarkEditorRoute.kt
          grep -q 'Mask and timing' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt
          grep -q 'Track movement' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt
          grep -q 'Generate AI Preview' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt
          grep -q 'Apply non-destructively' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt
          grep -q 'AiWatermarkHistoryEntry' app/src/main/java/com/videoflow/app/data/history/EditHistoryService.kt
          grep -q 'featherWeight(globalX, globalY, logicalTarget' app/src/main/java/com/videoflow/app/ai/watermark/OnnxWatermarkEffect.kt
          grep -q 'FINAL_AI_EXPORT_CERTIFIED' app/src/androidTest/java/com/videoflow/app/ai/Step4AiFinalExportInstrumentedTest.kt
          grep -q 'onnxruntime-android:1.29.0' app/build.gradle.kts
          grep -q 'cab19978adc306622fe37ef60d4a52103b99c98141d499c2a2366a7ed1255dbe' app/src/main/java/com/videoflow/app/domain/ai/WatermarkModels.kt
          grep -q '1941214c210399eb815eb2d32570ba91d5e6c4ac3de4c939bd3fb09300454972' app/src/main/java/com/videoflow/app/domain/ai/WatermarkModels.kt
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test "$(grep -c 'tools:node="remove"' app/src/main/AndroidManifest.xml)" -ge 2
          ! grep -R -qE 'https?://|HttpURLConnection|OkHttp|Retrofit|DownloadManager' app/src/main/java/com/videoflow/app/ai app/src/main/java/com/videoflow/app/data/ai app/src/main/java/com/videoflow/app/domain/ai app/src/main/java/com/videoflow/app/ui/ai
          ! grep -R -qE 'FirebaseAnalytics|Crashlytics|Sentry|Mixpanel|Amplitude|Segment' app/src/main/java app/build.gradle.kts
          ! grep -R -qE 'readBytes\(\)|readAllBytes\(\)' app/src/main/java/com/videoflow/app/ai app/src/main/java/com/videoflow/app/data/ai

      - name: Full Step 1-4 unit regression
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Compile instrumentation and Compose tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Assemble Debug, Review and instrumentation APKs with local AI assets
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleReview --stacktrace

      - name: Verify Review identity, signature, offline permissions and embedded model pack
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/review/app-review.apk'
          TEST_APK='app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee review-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee review-permissions.txt
          grep -q "package: name='com.videoflow.app.review'" review-badging.txt
          ! grep -q "android.permission.INTERNET" review-permissions.txt
          ! grep -q "android.permission.ACCESS_NETWORK_STATE" review-permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee review-signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: f3d4e66b350800bca739b2c5f6f4d2c7f15c7dc89b1b8763bd51468ab7150cc7' review-signature.txt
          unzip -l "$APK" | grep -q 'assets/models/lama-512-int8.onnx'
          unzip -l "$APK" | grep -q 'assets/models/lama-dynamic-int8.onnx'
          unzip -l "$TEST_APK" | grep -q 'assets/sample_av.mp4'

      - name: Package Step 4 Review and exact runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p step4-artifacts step4-runtime
          git rev-parse HEAD > step4-artifacts/SOURCE_COMMIT.txt
          cp app/build/outputs/apk/review/app-review.apk step4-artifacts/VideoFlow_Step5_Review.apk
          cp app/build/outputs/apk/debug/app-debug.apk step4-artifacts/VideoFlow_Step5_Debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk step4-artifacts/VideoFlow_Step5_Debug-androidTest.apk
          cp review-badging.txt review-permissions.txt review-signature.txt androidtest-video-fixture.txt step4-artifacts/
          cp STEP_5_*.md RELEASE_CANDIDATE_MANIFEST.md step4-artifacts/
          (cd step4-artifacts && sha256sum *.apk | tee SHA256SUMS.txt)
          cp app/build/outputs/apk/debug/app-debug.apk step4-runtime/VideoFlow_Step5_Debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk step4-runtime/VideoFlow_Step5_Debug-androidTest.apk
          cp app/build/outputs/apk/review/app-review.apk step4-runtime/VideoFlow_Step5_Review.apk
          (cd step4-runtime && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload Step 4 APKs
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Step5-APKs
          path: step4-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact API 35 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Step5-Runtime-Bundle
          path: step4-runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Step5-Build-Evidence
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30

  api35-ai-certification:
    name: API 35 final AI export, runtime, editor and Review certification
    needs: step4-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/system-images" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/sources" "$ANDROID_HOME/extras" || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Download exact runtime bundle from build job
        uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Step5-Runtime-Bundle
          path: step4-runtime

      - name: Verify exact runtime bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd step4-runtime && sha256sum -c SHA256SUMS.txt)

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$USER":"$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm

      - name: API 35 Step 4 real final AI export and product regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disk-size: 3072M
          script: |
            set -e
            mkdir -p step4-emulator-reports
            adb install -r step4-runtime/VideoFlow_Step5_Debug.apk
            adb install -r step4-runtime/VideoFlow_Step5_Debug-androidTest.apk

            adb shell svc wifi disable
            adb shell svc data disable
            adb shell pm grant com.videoflow.app.debug android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -r -e class com.videoflow.app.step5.Step5AiOutsideRoiTest,com.videoflow.app.step5.Step5RecoverySecurityTest,com.videoflow.app.step5.Step5QualityExportTest,com.videoflow.app.step5.Step5AudioVideoSyncTest,com.videoflow.app.step5.Step5CheckpointOverlayTest,com.videoflow.app.step5.Step5ProductIntegrationTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/step5-integration.txt 2>&1
            cat step4-emulator-reports/step5-integration.txt
            adb pull /sdcard/Android/data/com.videoflow.app.debug/files/step5-evidence step4-emulator-reports/ || true
            adb pull /sdcard/Android/data/com.videoflow.app.debug/files/professional-screenshots step4-emulator-reports/ || true
            adb logcat -d -v threadtime > step4-emulator-reports/step5-logcat.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step4-emulator-reports/step5-integration.txt
            grep -E -q 'OK \(12 tests\)' step4-emulator-reports/step5-integration.txt
            grep -q 'STEP5_OVERLAY_CHECKPOINT_CERTIFIED' step4-emulator-reports/step5-integration.txt
            grep -q 'STEP5_PRODUCT_INTEGRATION_CERTIFIED' step4-emulator-reports/step5-integration.txt
            for configuration in portrait landscape tablet; do
              if [ "$configuration" = landscape ]; then adb shell wm size 1280x720; adb shell wm density 240; fi
              if [ "$configuration" = tablet ]; then adb shell wm size 1920x1200; adb shell wm density 160; fi
              adb shell settings put system font_scale 1.3
              adb shell am instrument -w -r -e class com.videoflow.app.step5.Step5TimelineAccessibilityTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > "step4-emulator-reports/step5-layout-$configuration.txt" 2>&1
              cat "step4-emulator-reports/step5-layout-$configuration.txt"
              ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' "step4-emulator-reports/step5-layout-$configuration.txt"
              grep -E -q 'OK \(1 test\)' "step4-emulator-reports/step5-layout-$configuration.txt"
            done
            adb shell wm size reset
            adb shell wm density reset
            adb shell settings put system font_scale 1.0
            adb shell am instrument -w -r -e class 'com.videoflow.app.step5.Step5ProcessDeathTest#startRealForegroundAiJob' com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/step5-process-start.txt 2>&1
            cat step4-emulator-reports/step5-process-start.txt
            grep -E -q 'OK \(1 test\)' step4-emulator-reports/step5-process-start.txt
            adb shell am force-stop com.videoflow.app.debug
            adb shell am instrument -w -r -e class 'com.videoflow.app.step5.Step5ProcessDeathTest#restartRecognizesInterruptedJobAndPreservesEditableProject' com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/step5-process-recovery.txt 2>&1
            cat step4-emulator-reports/step5-process-recovery.txt
            grep -E -q 'OK \(1 test\)' step4-emulator-reports/step5-process-recovery.txt
            adb pull /sdcard/Android/data/com.videoflow.app.debug/files/step5-evidence step4-emulator-reports/
            test -s step4-emulator-reports/step5-evidence/quality.jsonl
            test -s step4-emulator-reports/step5-evidence/av-sync.jsonl

            adb shell am instrument -w -r -e class com.videoflow.app.ui.ProfessionalProductWorkflowTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/product-panels.txt 2>&1
            adb pull /sdcard/Android/data/com.videoflow.app.debug/files/professional-screenshots step4-emulator-reports/ || true
            adb logcat -d -v threadtime > step4-emulator-reports/player-logcat.txt
            cat step4-emulator-reports/product-panels.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step4-emulator-reports/product-panels.txt
            grep -E -q 'OK \(1 test\)' step4-emulator-reports/product-panels.txt
            grep -q 'PROFESSIONAL_PRODUCT_PANELS_CERTIFIED' step4-emulator-reports/product-panels.txt
            test -s step4-emulator-reports/professional-screenshots/ai-preview.png

            adb shell am instrument -w -r -e class com.videoflow.app.ai.Step4AiRuntimeInstrumentedTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/ai-runtime.txt 2>&1
            cat step4-emulator-reports/ai-runtime.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step4-emulator-reports/ai-runtime.txt
            grep -E -q 'OK \([0-9]+ tests?\)' step4-emulator-reports/ai-runtime.txt

            adb shell am instrument -w -r -e class com.videoflow.app.ai.Step4AiFinalExportInstrumentedTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/final-ai-export.txt 2>&1
            cat step4-emulator-reports/final-ai-export.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step4-emulator-reports/final-ai-export.txt
            grep -E -q 'OK \(1 test\)' step4-emulator-reports/final-ai-export.txt
            grep -q 'FINAL_AI_EXPORT_CERTIFIED' step4-emulator-reports/final-ai-export.txt

            adb shell am instrument -w -r -e class com.videoflow.app.ui.HomeComposeTest,com.videoflow.app.ui.EditorWorkspaceVisualCertificationTest,com.videoflow.app.ui.LongTimelineWorkspaceSmokeTest,com.videoflow.app.ui.ContextualToolbarComposeTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/editor-regression.txt 2>&1
            cat step4-emulator-reports/editor-regression.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step4-emulator-reports/editor-regression.txt
            grep -E -q 'OK \([0-9]+ tests?\)' step4-emulator-reports/editor-regression.txt

            adb shell am instrument -w -r -e class com.videoflow.app.editor.ProfessionalAudioPersistenceTest,com.videoflow.app.ui.ProfessionalToolControlsTest,com.videoflow.app.ai.ProfessionalCombinedExportInstrumentedTest,com.videoflow.app.ai.ProfessionalCheckpointExportInstrumentedTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/professional-upgrade.txt 2>&1
            adb pull /sdcard/Android/data/com.videoflow.app.debug/files/professional-screenshots step4-emulator-reports/ || true
            cat step4-emulator-reports/professional-upgrade.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step4-emulator-reports/professional-upgrade.txt
            grep -E -q 'OK \(5 tests\)' step4-emulator-reports/professional-upgrade.txt
            grep -q 'PROFESSIONAL_COMBINED_EXPORT_CERTIFIED' step4-emulator-reports/professional-upgrade.txt
            grep -q 'PROFESSIONAL_CHECKPOINT_EXPORT_CERTIFIED' step4-emulator-reports/professional-upgrade.txt

            adb shell am instrument -w -r -e class com.videoflow.app.db.RoomPersistenceTest,com.videoflow.app.db.Step2MigrationTest,com.videoflow.app.editor.Step2ComplexPersistenceTest,com.videoflow.app.editor.ProxyManagerInstrumentationTest,com.videoflow.app.media.MediaAnalyzerInstrumentationTest,com.videoflow.app.media.PlayerInstrumentationTest,com.videoflow.app.export.NativeRenderEngineInstrumentedTest,com.videoflow.app.export.SafMediaMuxerFactoryInstrumentedTest com.videoflow.app.debug.test/androidx.test.runner.AndroidJUnitRunner > step4-emulator-reports/retained-product-regression.txt 2>&1
            cat step4-emulator-reports/retained-product-regression.txt
            ! grep -E -q 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' step4-emulator-reports/retained-product-regression.txt
            grep -E -q 'OK \([0-9]+ tests?\)' step4-emulator-reports/retained-product-regression.txt

            adb uninstall com.videoflow.app.review >/dev/null 2>&1 || true
            adb install step4-runtime/VideoFlow_Step5_Review.apk | tee step4-emulator-reports/review-fresh-install.txt
            grep -q 'Success' step4-emulator-reports/review-fresh-install.txt
            adb shell monkey -p com.videoflow.app.review -c android.intent.category.LAUNCHER 1 > step4-emulator-reports/review-cold-launch.txt
            sleep 2
            adb shell pidof com.videoflow.app.review | tee -a step4-emulator-reports/review-cold-launch.txt
            adb install -r step4-runtime/VideoFlow_Step5_Review.apk | tee step4-emulator-reports/review-in-place-update.txt
            grep -q 'Success' step4-emulator-reports/review-in-place-update.txt
            adb shell monkey -p com.videoflow.app.review -c android.intent.category.LAUNCHER 1 >> step4-emulator-reports/review-in-place-update.txt
            sleep 2
            adb shell pidof com.videoflow.app.review | tee -a step4-emulator-reports/review-in-place-update.txt

      - name: Upload API 35 Step 4 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Step5-API35-Certification
          path: step4-emulator-reports/
          if-no-files-found: warn
          retention-days: 30

  long-media-architecture:
    name: Long-media architecture evidence
    needs: step4-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Step5-Build-Evidence
          path: verified-build
      - run: python scripts/step5/certify.py architecture verified-build
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Step5-Long-Media-Evidence
          path: long-media-evidence.json
          if-no-files-found: error

  privacy-packaging:
    name: Privacy, model and RC package integrity
    needs: step4-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Step5-APKs
          path: verified-apks
      - run: python scripts/step5/certify.py packaging verified-apks
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Step5-Packaging-Evidence
          path: packaging-evidence.json
          if-no-files-found: error

  exact-head-report:
    name: Exact-head RC completion and physical test package
    needs: [step4-build, api35-ai-certification, long-media-architecture, privacy-packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Step5-APKs
          path: verified-apks
      - uses: actions/download-artifact@v4
        with:
          name: Step5-Build-Evidence
          path: verified-build
      - uses: actions/download-artifact@v4
        with:
          name: VideoFlow-Step5-API35-Certification
          path: verified-runtime
      - name: Bind successful evidence to exact head and prepare physical package
        env:
          CERTIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/step5/certify.py report
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Step5-Completion-Report
          path: completion-report/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Step5-Physical-Test-Package
          path: VideoFlow_Step5_Physical_Test_Package.zip
          if-no-files-found: error
          retention-days: 30
