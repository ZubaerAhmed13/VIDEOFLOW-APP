name: VideoFlow UX Step 2 Product Certification Apply

on:
  push:
    branches:
      - ux-step2-trim-speed-crop
    paths:
      - scripts/ux_step2/strengthen_step2_product_certification.py
      - .github/workflows/ux-step2-product-certification-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-step2-product-cert-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Step 1 ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE='0123b734f687dfdbf0589b6040aeb4d8642c5968'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
      - name: Apply production-panel testability and Step 2 product tests
        run: python scripts/ux_step2/strengthen_step2_product_certification.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt
          test -s app/src/androidTest/java/com/videoflow/app/step5/UXStep2CropRenderGeometryTest.kt
          grep -q 'onCommitSpeed' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
          grep -q 'onCommitCrop' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt
      - name: Commit strengthened Step 2 tests and wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt \
            app/src/androidTest/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropProductComposeTest.kt \
            app/src/androidTest/java/com/videoflow/app/step5/UXStep2CropRenderGeometryTest.kt
          if git diff --cached --quiet; then
            echo 'Strengthening already applied.'
            exit 0
          fi
          git commit -m 'Strengthen Step 2 product and render certification'
          git push origin HEAD:ux-step2-trim-speed-crop
