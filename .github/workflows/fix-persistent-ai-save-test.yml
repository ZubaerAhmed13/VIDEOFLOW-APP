name: Fix persistent AI save integration assertion

on:
  push:
    branches:
      - step5-final-hardening-certification
    paths:
      - .github/workflows/fix-persistent-ai-save-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard progressive Watermark save geometry and patch obsolete scroll assumption
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          panel = Path('app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt').read_text()
          test_path = Path('app/src/androidTest/java/com/videoflow/app/step5/Step5ProductIntegrationTest.kt')
          test = test_path.read_text()

          # Fail closed unless the product still has the intended progressive UX and
          # the Save control is persistent outside the Refine scroll container.
          required = [
              'StudioHeader("Remove Watermark", "")',
              'contentDescription = "Refine watermark removal"',
              'contentDescription = "Save AI removal"',
              'HorizontalDivider(color = VideoFlowEditorColors.EditorDivider)',
              'OutlinedButton(onClick = onDismiss',
          ]
          for marker in required:
              if marker not in panel:
                  raise SystemExit(f'missing progressive-UX marker: {marker}')

          scroll_pos = panel.index('Modifier.fillMaxWidth().weight(1f).verticalScroll')
          save_pos = panel.index('contentDescription = "Save AI removal"')
          if save_pos <= scroll_pos:
              raise SystemExit('Save AI removal is no longer the persistent footer control expected by this correction')

          old = 'rule.onNodeWithContentDescription("Save AI removal").assertIsEnabled().performScrollTo().performClick()'
          new = 'rule.onNodeWithContentDescription("Save AI removal").assertIsDisplayed().assertIsEnabled().performClick()'
          if test.count(old) != 1:
              raise SystemExit(f'expected exactly one obsolete save assertion, found {test.count(old)}')
          if new in test:
              raise SystemExit('corrected save assertion already present unexpectedly')

          test_path.write_text(test.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/androidTest/java/com/videoflow/app/step5/Step5ProductIntegrationTest.kt
      - name: Commit exact assertion correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/androidTest/java/com/videoflow/app/step5/Step5ProductIntegrationTest.kt
          git diff --cached --quiet && { echo 'No patch produced'; exit 1; }
          git commit -m 'test: certify persistent AI save control without scroll assumption'
          git push origin HEAD:step5-final-hardening-certification
