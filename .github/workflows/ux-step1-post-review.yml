name: Apply UX Step 1 Post Review Corrections

on:
  push:
    branches:
      - ux-step1-editor-shell-layout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-step1-post-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ux-step1-editor-shell-layout
          fetch-depth: 0

      - name: Apply exact post-review corrections
        run: python3 scripts/ux_step1/post_review.py

      - name: Verify correction shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'heightIn(min = metrics.minimumPreviewHeight)' app/src/main/java/com/videoflow/app/ui/editor/EditorWorkspaceScaffold.kt
          grep -q 'Legacy effect lanes remain reachable after the track stack' app/src/main/java/com/videoflow/app/ui/editor/TimelineWorkspace.kt
          grep -q 'contentDescription = "Open ${track.name} settings"' app/src/main/java/com/videoflow/app/ui/editor/TimelineWorkspace.kt

      - name: Commit exact correction if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'VideoFlow UX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/videoflow/app/ui/editor
          git commit -m 'ux: harden Step 1 viewport geometry'
          git push origin HEAD:ux-step1-editor-shell-layout
