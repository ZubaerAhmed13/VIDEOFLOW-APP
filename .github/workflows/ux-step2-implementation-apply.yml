name: Apply UX Step 2 Trim Speed Crop

on:
  push:
    branches: [ux-step2-trim-speed-crop]
    paths:
      - scripts/ux_step2/apply_trim_speed_crop.py
      - .github/workflows/ux-step2-implementation-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-step2-implementation-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-step2-trim-speed-crop
          fetch-depth: 0
      - name: Assert certified Step-1 ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE='0123b734f687dfdbf0589b6040aeb4d8642c5968'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
      - name: Apply deterministic Step-2 patch
        run: python3 scripts/ux_step2/apply_trim_speed_crop.py
      - name: Validate generated patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -q 'trimSourceRangeKeepingTimelineAnchor' app/src/main/java/com/videoflow/app/domain/editor/TimelineEngine.kt
          grep -q 'effectivePreviewSpeed' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          grep -q 'uniformCropPreviewGeometry' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          test -f .github/workflows/android-ux-step2-trim-speed-crop-certification.yml
          test -f UX_STEP_2_TRIM_SPEED_CROP_COMPLETION_REPORT.md
      - name: Commit generated Step-2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'videoflow-ux-step2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app .github/workflows/android-ux-step2-trim-speed-crop-certification.yml UX_STEP_2_TRIM_SPEED_CROP_COMPLETION_REPORT.md
          if git diff --cached --quiet; then
            echo 'No generated source changes.'
            exit 0
          fi
          git commit -m 'Implement UX Step 2 Trim Speed Crop'
          git push origin HEAD:ux-step2-trim-speed-crop
