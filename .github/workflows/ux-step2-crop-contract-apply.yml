name: UX Step 2 Crop Contract Apply

on:
  push:
    branches:
      - ux-step2-trim-speed-crop
    paths:
      - .github/workflows/ux-step2-crop-contract-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-step2-trim-speed-crop
          fetch-depth: 0

      - name: Apply atomic crop contract correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(base64.b64decode(''))"
          git diff --check
          grep -q 'media3CropEffectOrNull' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          grep -q 'media3CropEffectOrNull(clip.transform.crop)' app/src/main/java/com/videoflow/app/render/Media3CompositionBuilder.kt
          ! grep -q 'uniformCropPreviewGeometry' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          ! grep -q 'cropCenterX' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          grep -q 'onDone = { onCommitCrop(crop) }' app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt

      - name: Commit corrected Step 2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/videoflow/app/render/effects/Media3CropEffect.kt \
                  app/src/main/java/com/videoflow/app/render/Media3CompositionBuilder.kt \
                  app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt \
                  app/src/main/java/com/videoflow/app/ui/editor/ContextualEditingMath.kt \
                  app/src/main/java/com/videoflow/app/ui/editor/ContextualToolPanels.kt \
                  app/src/test/java/com/videoflow/app/ui/editor/UXStep2TrimSpeedCropCoreTest.kt
          git commit -m 'Fix Step 2 crop preview-render geometry contract'
          git push origin HEAD:ux-step2-trim-speed-crop
