name: Safe Final Precise Trim Correction

on:
  push:
    branches:
      - safe/final-precise-trim-controls-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/final-precise-trim-controls-20260909
          fetch-depth: 0

      - name: Apply exact final correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          chrome = Path('app/src/main/java/com/videoflow/app/ui/editor/EditorChrome.kt')
          chrome_text = chrome.read_text()
          obsolete = '        ToolButton(Icons.Default.Tune, "Precise Trim") { onTool(EditorTool.Trim(clipId, startPrecise = true)) }\n'
          if chrome_text.count(obsolete) != 1:
              raise SystemExit(f'guard failed: expected exactly one standalone Precise Trim toolbar button, found {chrome_text.count(obsolete)}')
          chrome.write_text(chrome_text.replace(obsolete, '', 1))

          test = Path('app/src/androidTest/java/com/videoflow/app/ui/ProfessionalToolControlsTest.kt')
          text = test.read_text()

          anchor = '        var playhead by mutableLongStateOf(3_600_123_000L)\n'
          inserted = '''        var playhead by mutableLongStateOf(3_600_123_000L)
          var showCrop by mutableStateOf(false)
          var crop by mutableStateOf(CropRect(.2f,.2f,.8f,.8f))
          var committed: CropRect?=null
          val initial=crop
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'guard failed: precise test state anchor count={text.count(anchor)}')
          text = text.replace(anchor, inserted, 1)

          old_content = '        rule.setContent { MaterialTheme { Column(Modifier.verticalScroll(rememberScrollState())) { PreciseRangeControls(7_200_000_000L,start,end,playhead,{a,b->start=a;end=b},{playhead=it}) } } }\n'
          new_content = '''        rule.setContent {
              MaterialTheme {
                  if (showCrop) {
                      Box(Modifier.size(300.dp)) {
                          CropInteractionOverlay(
                              crop=crop,
                              aspectRatio=1f,
                              onCropChange={crop=it},
                              onCropCommit={committed=it},
                              modifier=Modifier.semantics { contentDescription="Crop direct interaction" }
                          )
                      }
                  } else {
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          PreciseRangeControls(7_200_000_000L,start,end,playhead,{a,b->start=a;end=b},{playhead=it})
                      }
                  }
              }
          }
          '''
          if text.count(old_content) != 1:
              raise SystemExit(f'guard failed: first setContent count={text.count(old_content)}')
          text = text.replace(old_content, new_content, 1)

          old_second = '''        var crop by mutableStateOf(CropRect(.2f,.2f,.8f,.8f))
          var committed: CropRect?=null
          val initial=crop
          rule.setContent {
              MaterialTheme {
                  Box(Modifier.size(300.dp)) {
                      CropInteractionOverlay(
                          crop=crop,
                          aspectRatio=1f,
                          onCropChange={crop=it},
                          onCropCommit={committed=it},
                          modifier=Modifier.semantics { contentDescription="Crop direct interaction" }
                      )
                  }
              }
          }
          '''
          new_second = '''        rule.runOnIdle { showCrop=true }
          rule.waitForIdle()
          '''
          if text.count(old_second) != 1:
              raise SystemExit(f'guard failed: second setContent block count={text.count(old_second)}')
          text = text.replace(old_second, new_second, 1)
          test.write_text(text)
          PY

          git diff --check
          if grep -F 'ToolButton(Icons.Default.Tune, "Precise Trim")' app/src/main/java/com/videoflow/app/ui/editor/EditorChrome.kt; then
            echo 'Standalone Precise Trim toolbar entry still exists' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/androidTest/java/com/videoflow/app/ui/ProfessionalToolControlsTest.kt').read_text()
          marker = '@Test fun preciseRangeKeepsHourScaleTimeAndSetStartEnd()'
          body = text.split(marker,1)[1]
          next_test = body.find('\n    @Test ')
          if next_test >= 0:
              body = body[:next_test]
          count = body.count('rule.setContent')
          if count != 1:
              raise SystemExit(f'precise/crop test must own exactly one Compose root, found {count}')
          required = [
              'assertEquals(3_600_123_000L,start)',
              'assertEquals(5_400_456_000L,end)',
              'assertEquals(0L,start);assertEquals(7_200_000_000L,end)',
              'assertNotEquals("Corner drag must change crop geometry",initial,crop)',
              'assertEquals("Drag end must commit the same geometry shown in preview",crop,committed)',
              'assertEquals("1:1 aspect must stay constrained while dragging",1f,ratio,.03f)',
          ]
          missing = [item for item in required if item not in body]
          if missing:
              raise SystemExit(f'coverage guard failed; missing assertions: {missing}')
          print('Coverage guards PASS: all precise-trim and crop assertions retained')
          PY

          git diff -- app/src/main/java/com/videoflow/app/ui/editor/EditorChrome.kt app/src/androidTest/java/com/videoflow/app/ui/ProfessionalToolControlsTest.kt

      - name: Commit source and test-harness correction only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/safe-final-precise-trim.yml
          git config user.name 'VideoFlow Certification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/videoflow/app/ui/editor/EditorChrome.kt app/src/androidTest/java/com/videoflow/app/ui/ProfessionalToolControlsTest.kt .github/workflows/safe-final-precise-trim.yml
          git commit -m 'fix: consolidate precise trim and stabilize Compose controls test'
          git push origin HEAD:safe/final-precise-trim-controls-20260909
