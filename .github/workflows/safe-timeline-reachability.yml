name: Safe Timeline Reachability Patch

on:
  push:
    branches:
      - safe/timeline-scroll-reachability-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/timeline-scroll-reachability-20260909
          fetch-depth: 0

      - name: Apply exact production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/videoflow/app/ui/editor/TimelineWorkspace.kt')
          text = path.read_text()

          for old in [
              'import androidx.compose.foundation.lazy.LazyColumn\n',
              'import androidx.compose.foundation.lazy.items\n',
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'guard failed for import: {old!r}')
              text = text.replace(old, '', 1)

          old = '''                LazyColumn(Modifier.fillMaxWidth().weight(1f)) {
                    item("timed-edits") { TimedEffectIndicators(clips,revision,horizontal,totalWidth,pixelsPerSecond,onSelect,onSeek,onProfessionalTool,originUs,windowEndUs) }
                    items(tracks.sortedBy { it.orderIndex },key={it.id}) { track ->
                        TrackRow(
                            track = track,
                            originUs = originUs,
                            windowEndUs = windowEndUs,
                            clips = clips.filter { it.trackId == track.id },
                            textOverlays = textOverlays.filter { it.trackId == track.id },
                            imageOverlays = imageOverlays.filter { it.trackId == track.id },
                            keyframes = keyframes,
                            playheadUs = playheadUs,
                            totalWidth = totalWidth,
                            pixelsPerSecond = pixelsPerSecond,
                            horizontal = horizontal,
                            selection = selection,
                            mediaNames = mediaNames,
                            thumbnails = thumbnails,
                            waveforms = waveforms,
                            onSeek = onSeek,
                            onSelect = onSelect,
                            onClearSelection = onClearSelection,
                            onMoveClip = onMoveClip,
                            onTrimClipStart = onTrimClipStart,
                            onTrimClipEnd = onTrimClipEnd,
                            onToggleMute = { onToggleMute(track) },
                            onToggleVisible = { onToggleVisible(track) },
                            onToggleLock = { onToggleLock(track) },
                            onTrackSettings = { onTrackSettings(track) }
                        )
                    }
                }'''

          new = '''                Column(
                    Modifier
                        .fillMaxWidth()
                        .weight(1f)
                        .verticalScroll(rememberScrollState())
                ) {
                    TimedEffectIndicators(clips,revision,horizontal,totalWidth,pixelsPerSecond,onSelect,onSeek,onProfessionalTool,originUs,windowEndUs)
                    tracks.sortedBy { it.orderIndex }.forEach { track ->
                        TrackRow(
                            track = track,
                            originUs = originUs,
                            windowEndUs = windowEndUs,
                            clips = clips.filter { it.trackId == track.id },
                            textOverlays = textOverlays.filter { it.trackId == track.id },
                            imageOverlays = imageOverlays.filter { it.trackId == track.id },
                            keyframes = keyframes,
                            playheadUs = playheadUs,
                            totalWidth = totalWidth,
                            pixelsPerSecond = pixelsPerSecond,
                            horizontal = horizontal,
                            selection = selection,
                            mediaNames = mediaNames,
                            thumbnails = thumbnails,
                            waveforms = waveforms,
                            onSeek = onSeek,
                            onSelect = onSelect,
                            onClearSelection = onClearSelection,
                            onMoveClip = onMoveClip,
                            onTrimClipStart = onTrimClipStart,
                            onTrimClipEnd = onTrimClipEnd,
                            onToggleMute = { onToggleMute(track) },
                            onToggleVisible = { onToggleVisible(track) },
                            onToggleLock = { onToggleLock(track) },
                            onTrackSettings = { onTrackSettings(track) }
                        )
                    }
                }'''

          if text.count(old) != 1:
              raise SystemExit('guard failed: expected exactly one LazyColumn track block')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- app/src/main/java/com/videoflow/app/ui/editor/TimelineWorkspace.kt

      - name: Commit source-only final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/safe-timeline-reachability.yml
          git config user.name 'VideoFlow Certification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/videoflow/app/ui/editor/TimelineWorkspace.kt .github/workflows/safe-timeline-reachability.yml
          git commit -m 'fix: make all bounded timeline tracks scroll-reachable'
          git push origin HEAD:safe/timeline-scroll-reachability-20260909
