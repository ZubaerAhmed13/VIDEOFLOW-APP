name: UX Step 2 Lint Opt-In Apply

on:
  push:
    branches:
      - ux-step2-trim-speed-crop
    paths:
      - .github/workflows/ux-step2-lint-optin-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-step2-trim-speed-crop
          fetch-depth: 0
      - name: Apply local Media3 opt-in
        shell: bash
        run: >-
          python -c 'from pathlib import Path; p=Path("app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt"); s=p.read_text(); old="@Composable\nfun PreviewWorkspace("; new="@androidx.annotation.OptIn(androidx.media3.common.util.UnstableApi::class)\n@Composable\nfun PreviewWorkspace("; assert old in s, "PreviewWorkspace anchor missing"; p.write_text(s.replace(old,new,1))'
      - name: Verify narrow patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          grep -q '@androidx.annotation.OptIn(androidx.media3.common.util.UnstableApi::class)' app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VideoFlow Step 2 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/videoflow/app/ui/editor/PreviewWorkspace.kt
          git commit -m 'Opt in PreviewWorkspace to Media3 unstable crop API'
          git push origin HEAD:ux-step2-trim-speed-crop
