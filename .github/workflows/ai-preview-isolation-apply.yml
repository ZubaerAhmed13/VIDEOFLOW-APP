name: Apply AI Preview Process Isolation

on:
  push:
    branches:
      - step5-final-hardening-certification
    paths:
      - scripts/apply_ai_preview_isolation.py
      - scripts/apply_final_editor_cleanup.py
      - .github/workflows/ai-preview-isolation-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-preview-isolation-apply
  cancel-in-progress: false

jobs:
  isolate-ai-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: step5-final-hardening-certification
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          mkdir -p "$ANDROID_HOME/platforms"
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          sdkmanager 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --gradle-distribution-sha256-sum bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          chmod +x gradlew

      - name: Apply deterministic AI preview isolation patch
        run: python3 scripts/apply_ai_preview_isolation.py

      - name: Apply final editor cleanup
        run: python3 scripts/apply_final_editor_cleanup.py

      - name: Validate patch formatting and architecture guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'android:process=":ai_preview"' app/src/main/AndroidManifest.xml
          grep -q 'aiPreviewClient.renderStill' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioViewModel.kt
          grep -q 'aiPreviewClient.renderMoving' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioViewModel.kt
          ! grep -q 'previewEngine.render' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioViewModel.kt
          ! grep -q 'processedPreviewManager.prepareDraftWindow' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioViewModel.kt
          ! grep -q 'modelPackManager.ensurePackInstalled' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioViewModel.kt
          ! grep -R -q 'ProfessionalEditorTool.PreciseTrim' app/src/main app/src/androidTest
          ! grep -q 'data class PreciseTrim' app/src/main/java/com/videoflow/app/ui/editor/ProfessionalEditorTool.kt
          grep -q 'AI stage Done' app/src/androidTest/java/com/videoflow/app/ui/ProfessionalProductWorkflowTest.kt
          grep -q 'Save AI removal' app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt

      - name: Compile production, unit tests and instrumentation source
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Commit verified isolation implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No AI preview isolation changes remain to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/AndroidManifest.xml \
                  app/src/main/java/com/videoflow/app/ai/watermark/AiPreviewIsolatedService.kt \
                  app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioViewModel.kt \
                  app/src/main/java/com/videoflow/app/ui/ai/WatermarkStudioPanel.kt \
                  app/src/main/java/com/videoflow/app/ui/editor/ProfessionalEditorTool.kt \
                  app/src/androidTest/java/com/videoflow/app/ui/ProfessionalToolControlsTest.kt \
                  app/src/androidTest/java/com/videoflow/app/ui/ProfessionalProductWorkflowTest.kt \
                  scripts/step5/run_api35.sh \
                  .github/workflows/android-step5-certification.yml
          git commit -m 'fix: isolate editor AI preview runtime from main process'
          git push origin HEAD:step5-final-hardening-certification
